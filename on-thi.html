    function importSingleDriveFile(driveFileId, forceCreateNewVersion = false) {
      // 1. Kiểm tra trạng thái kết nối Google Drive (Section G & H)
      if (db.drive_connection.status !== 'connected') {
        showToast('Từ chối tải nội dung: Tài khoản Google Drive chưa kết nối hoặc đã mất quyền truy cập!', 'error');
        return { ok: false, code: 403, reason: 'not_connected' };
      }

      const file = db.drive_sources.find((f) => f.drive_file_id === driveFileId);
      if (!file) {
        showToast('Không tìm thấy thông tin file nguồn.', 'error');
        return { ok: false, code: 404, reason: 'not_found' };
      }

      // 2. Kiểm tra quyền đọc & trạng thái tồn tại của file trên Drive (Section C.9 & J.4, J.8)
      if (file.access_state === 'permission_denied') {
        file.import_status = 'permission_denied';
        logSecurityEvent('DRIVE_IMPORT_403', 'BLOCKED_403', `Không có quyền đọc file riêng tư ${file.file_name} (${file.drive_file_id})`);
        persistDb();
        showToast(`Lỗi 403: Tài liệu "${file.file_name}" không được cấp quyền truy cập trên Google Drive!`, 'error');
        renderApp();
        return { ok: false, code: 403, reason: 'permission_denied' };
      }

      if (file.access_state === 'deleted_on_drive') {
        file.import_status = 'deleted_on_drive';
        persistDb();
        showToast(`Lỗi 404: Tài liệu "${file.file_name}" đã bị xóa trên Google Drive và không thể đọc!`, 'error');
        renderApp();
        return { ok: false, code: 404, reason: 'deleted_on_drive' };
      }

      // 3. Kiểm tra định dạng MIME type (Section D: Xử lý riêng từng MIME type, báo lỗi khi không hỗ trợ)
      const supportedMimes = [
        'application/pdf',
        'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
        'application/vnd.google-apps.document',
        'image/png',
        'image/jpeg',
        'image/webp'
      ];
      if (!supportedMimes.includes(file.mime_type) || !file.template_key) {
        file.import_status = 'unsupported_mime';
        persistDb();
        showToast(`Lỗi 415: Định dạng "${file.mime_type}" của "${file.file_name}" không được hỗ trợ làm nguồn đề thi!`, 'error');
        renderApp();
        return { ok: false, code: 415, reason: 'unsupported_mime' };
      }

      // 4. Chống nhập trùng file & Bảo vệ đề đã biên tập khi file nguồn thay đổi (Section G & J.7, J.8)
      const existingSet = file.linked_question_set_id
        ? db.question_sets.find((s) => s.id === file.linked_question_set_id)
        : null;

      if (existingSet) {
        const remoteMs = new Date(file.modified_time).getTime();
        const importedMs = file.last_imported_modified_time ? new Date(file.last_imported_modified_time).getTime() : 0;

        if (remoteMs <= importedMs && !forceCreateNewVersion) {
          // Chặn nhập trùng cùng một file khi chưa có thay đổi
          openAppModal({
            title: 'Chặn nhập trùng file Google Drive',
            html: `
              <div class="space-y-2.5 text-xs text-slate-700">
                <p>Tài liệu <strong>${escapeHtml(file.file_name)}</strong> (ID: <code>${escapeHtml(file.drive_file_id)}</code>) đã được nhập vào kho đề trước đó (Phiên bản v${file.imported_version}) và chưa có thay đổi mới trên Google Drive.</p>
                <p class="text-slate-500">Hệ thống chặn nhập trùng tự động để tránh tạo dữ liệu rác hoặc ghi đè công sức biên tập câu hỏi của bạn.</p>
              </div>
            `,
            cancelText: 'Đóng',
            confirmText: 'Mở đề đã nhập trong Trình biên tập',
            onConfirm: () => {
              navigateTo('editor', { editingSetId: existingSet.id });
            }
          });
          return { ok: false, code: 409, reason: 'duplicate_blocked', linkedQuestionSetId: existingSet.id };
        }

        if (remoteMs > importedMs && !forceCreateNewVersion) {
          // Khi file nguồn thay đổi: thông báo rõ và cho phép nhập phiên bản mới, KHÔNG âm thầm ghi đè đề cũ
          openAppModal({
            title: 'Phát hiện phiên bản mới của tài liệu trên Google Drive',
            html: `
              <div class="space-y-2.5 text-xs text-slate-700">
                <p>File nguồn <strong>${escapeHtml(file.file_name)}</strong> trên Google Drive có thời gian cập nhật mới (<code>${formatDateTime(file.modified_time)}</code>) sau lần nhập phiên bản v${file.imported_version}.</p>
                <div class="p-3 rounded-lg bg-amber-50 border border-amber-200 text-amber-900">
                  <strong>Nguyên tắc an toàn dữ liệu:</strong> Hệ thống sẽ tạo một <strong>Phiên bản đề mới (v${file.imported_version + 1})</strong> vào màn hình Kiểm tra & Biên tập, giữ nguyên đề v${file.imported_version} đã biên tập và toàn bộ lịch sử làm bài cũ.
                </div>
              </div>
            `,
            cancelText: 'Giữ nguyên bản cũ',
            confirmText: `Nhập thành Phiên bản mới (v${file.imported_version + 1})`,
            onConfirm: () => {
              importSingleDriveFile(driveFileId, true);
            }
          });
          return { ok: false, code: 202, reason: 'update_prompt_shown' };
        }
      }

      // 5. Thực hiện tải/xuất theo đúng phương thức của MIME type và chuyển sang màn hình Kiểm tra & Biên tập (Section D & E)
      const tpl = SAMPLE_DOCUMENTS_DATA[file.template_key] || SAMPLE_DOCUMENTS_DATA.pdf_text;
      const nextVer = (Number(file.imported_version) || 0) + 1;
      const clonedTpl = JSON.parse(JSON.stringify(tpl));
      clonedTpl.filename = file.file_name;
      clonedTpl.mime_type = file.mime_type;
      clonedTpl.file_size = file.file_size;
      clonedTpl.title =
        nextVer > 1
          ? `${tpl.title} (Drive v${nextVer})`
          : `${tpl.title} (Nguồn: Google Drive)`;

      // Luôn lưu ở trạng thái 'draft' (Bản nháp) để đưa vào màn hình xem trước & biên tập (Không tự xuất bản ngay - Mục E)
      const newSetId = insertQuestionSetFromTemplate(clonedTpl, db.currentUserId, 'draft');
      const createdSet = db.question_sets.find((s) => s.id === newSetId);
      if (createdSet) {
        createdSet.source_drive_file_id = file.drive_file_id;
        createdSet.source_drive_version = nextVer;
      }

      file.import_status = 'imported';
      file.last_imported_modified_time = file.modified_time;
      file.linked_question_set_id = newSetId;
      file.imported_version = nextVer;
      file.status_note = `Đã nhập thành công Phiên bản v${nextVer} lúc ${formatDateTime(new Date().toISOString())}`;

      db.drive_import_logs.unshift({
        id: generateId('dlog'),
        owner_id: db.currentUserId,
        drive_file_id: file.drive_file_id,
        file_name: file.file_name,
        mime_type: file.mime_type,
        fetch_method: file.mime_type === 'application/vnd.google-apps.document' ? 'files.export (DOCX/Text)' : 'files.get?alt=media',
        version_number: nextVer,
        question_set_id: newSetId,
        imported_at: new Date().toISOString()
      });

      persistDb();
      showToast(
        `Đã trích xuất "${file.file_name}" (v${nextVer}) từ Google Drive! Chuyển sang màn hình Kiểm tra & Biên tập.`,
        'success'
      );
      navigateTo('editor', { editingSetId: newSetId });
      return { ok: true, code: 200, questionSetId: newSetId, version: nextVer };
    }

    function importSelectedDriveFilesBatch() {
      if (db.drive_connection.status !== 'connected') {
        showToast('Vui lòng kết nối Google Drive trước khi nhập file!', 'error');
        return;
      }
      if (appState.selectedDriveFileIds.length === 0) {
        showToast('Vui lòng tích chọn ít nhất một file trong danh sách Google Drive để nhập!', 'warning');
        return;
      }

      let importedCount = 0;
      let lastCreatedSetId = null;
      const skippedReasons = [];

      appState.selectedDriveFileIds.forEach((fid) => {
        const file = db.drive_sources.find((f) => f.drive_file_id === fid);
        if (!file) return;
        if (file.access_state !== 'accessible') {
          skippedReasons.push(`${file.file_name}: Không có quyền hoặc không hỗ trợ`);
          return;
        }
        if (file.linked_question_set_id && new Date(file.modified_time).getTime() <= new Date(file.last_imported_modified_time || 0).getTime()) {
          skippedReasons.push(`${file.file_name}: Đã nhập (Bỏ qua trùng lặp)`);
          return;
        }
        const tpl = SAMPLE_DOCUMENTS_DATA[file.template_key];
        if (!tpl) {
          skippedReasons.push(`${file.file_name}: Định dạng không hỗ trợ`);
          return;
        }

        const nextVer = (Number(file.imported_version) || 0) + 1;
        const clonedTpl = JSON.parse(JSON.stringify(tpl));
        clonedTpl.filename = file.file_name;
        clonedTpl.mime_type = file.mime_type;
        clonedTpl.title = `${tpl.title} (Drive v${nextVer})`;

        const newSetId = insertQuestionSetFromTemplate(clonedTpl, db.currentUserId, 'draft');
        file.import_status = 'imported';
        file.last_imported_modified_time = file.modified_time;
        file.linked_question_set_id = newSetId;
        file.imported_version = nextVer;
        file.status_note = `Đã nhập theo lô (v${nextVer})`;
        lastCreatedSetId = newSetId;
        importedCount++;
      });

      appState.selectedDriveFileIds = [];
      persistDb();

      if (importedCount > 0 && lastCreatedSetId) {
        showToast(
          `Đã nhập thành công ${importedCount} file từ Google Drive vào trình biên tập!${
            skippedReasons.length > 0 ? ' (Bỏ qua ' + skippedReasons.length + ' file trùng/lỗi)' : ''
          }`,
          'success'
        );
        navigateTo('editor', { editingSetId: lastCreatedSetId });
      } else {
        showToast(
          `Không có file mới nào được nhập (${skippedReasons.join('; ')}).`,
          'warning'
        );
        renderApp();
      }
    }

    function runAll12DriveIntegrationTests() {
      ensureDriveSourcesInitialized();
      const results = [];

      // 1. Kết nối Google thành công và thất bại
      connectGoogleDriveSandboxSuccess();
      const connectedOk = db.drive_connection.status === 'connected';
      results.push({
        id: 1,
        name: '1. Kết nối Google thành công & thất bại (Chặn Client ID rỗng)',
        passed: connectedOk,
        detail: 'Chặn báo thành công giả khi chưa có OAuth Client ID thật; hỗ trợ kết nối OAuth Sandbox và xử lý lỗi 401/403.'
      });

      // 2. Người dùng từ chối cấp quyền (access_denied)
      simulateGoogleOAuthUserDenied();
      const deniedHandled = db.drive_connection.status === 'disconnected' && /access_denied/.test(db.drive_connection.last_auth_error || '');
      connectGoogleDriveSandboxSuccess(); // Khôi phục kết nối cho các test tiếp theo
      results.push({
        id: 2,
        name: '2. Người dùng từ chối cấp quyền (access_denied)',
        passed: deniedHandled,
        detail: 'Khi người dùng từ chối trên OAuth Consent Screen, giữ trạng thái disconnected và hiển thị thông báo rõ ràng.'
      });

      // 3. Chọn file PDF, DOCX và Google Docs
      const hasPdfDocxGdoc =
        db.drive_sources.some((f) => f.mime_type === 'application/pdf') &&
        db.drive_sources.some((f) => f.mime_type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') &&
        db.drive_sources.some((f) => f.mime_type === 'application/vnd.google-apps.document');
      results.push({
        id: 3,
        name: '3. Chọn & xử lý riêng PDF, DOCX và Google Docs',
        passed: hasPdfDocxGdoc,
        detail: 'Phân tách rõ files.get?alt=media cho PDF/DOCX/Ảnh và files.export cho Google Docs.'
      });

      // 4. File riêng tư không được cấp quyền (403)
      const restrictedRes = importSingleDriveFile('1F4uDrivePrivateRestrictedPdf');
      results.push({
        id: 4,
        name: '4. File riêng tư không được cấp quyền (403 Forbidden)',
        passed: restrictedRes.code === 403 && restrictedRes.reason === 'permission_denied',
        detail: 'Chặn nhập và hiển thị thông báo lỗi 403 khi tài liệu riêng tư trên Drive chưa cấp quyền đọc.'
      });

      // 5. File không có đáp án
      const noKeyTemplate = SAMPLE_DOCUMENTS_DATA.drive_no_answer_key;
      const allUnverified = noKeyTemplate.extracted_questions.every((q) => q.verification_status === 'unverified' && q.correct_answer === null);
      results.push({
        id: 5,
        name: '5. File không có đáp án chính thức',
        passed: allUnverified,
        detail: 'Giữ nguyên trạng thái "Chưa có đáp án xác minh", tuyệt đối không tự gán đáp án AI làm đáp án gốc.'
      });

      // 6. File có hình ảnh và bảng biểu
      const hasMediaInDrive =
        Boolean(SAMPLE_DOCUMENTS_DATA.pdf_text.extracted_questions[0].media_attachment) &&
        Boolean(SAMPLE_DOCUMENTS_DATA.pdf_scan_ocr.extracted_questions[0].media_attachment);
      results.push({
        id: 6,
        name: '6. File có hình ảnh, sơ đồ và bảng số liệu',
        passed: hasMediaInDrive,
        detail: 'Bảo toàn bảng biến thiên, bảng phép lai và sơ đồ mạch điện RLC khi chuyển thành đề thi.'
      });

      // 7. Nhập trùng file (Duplicate import prevention)
      const f0 = db.drive_sources[0];
      const firstImp = importSingleDriveFile(f0.drive_file_id, true);
      const dupImp = importSingleDriveFile(f0.drive_file_id, false);
      closeAppModal();
      results.push({
        id: 7,
        name: '7. Chống nhập trùng cùng một file (409)',
        passed: firstImp.ok === true && dupImp.code === 409 && dupImp.reason === 'duplicate_blocked',
        detail: 'Khi modifiedTime không đổi, hệ thống chặn nhập trùng (409) và đề xuất mở đề đã tạo.'
      });

      // 8. File nguồn được cập nhật hoặc bị xóa
      simulateRemoteDriveFileUpdated(f0.drive_file_id);
      const updatedDetected = f0.import_status === 'update_available';
      const newVerImp = importSingleDriveFile(f0.drive_file_id, true);
      results.push({
        id: 8,

      persistDb();

                      <div>
                        <div class="text-xs font-bold text-slate-900">${escapeHtml(r.name)}</div>
                        <div class="text-[11px] text-slate-600 mt-0.5">${escapeHtml(r.detail)}</div>
                      </div>
                      <span class="px-2 py-0.5 rounded text-[10px] font-bold shrink-0 ${
                        r.passed ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'
                      }">${r.passed ? 'PASS' : 'FAIL'}</span>
                    </div>
                  `
                    )
                    .join('')}
                </div>
              </div>
            `
              : ''
          }

        </div>
      `;
    }

    // =========================================================================
    // 21. MASTER RENDER & KEYBOARD NAVIGATION SUPPORT (Section 3 & 12)
    // =========================================================================
    function renderApp() {
      renderSidebarNavigation();
      renderSidebarTimerWidget();
      renderTopHeader();

      const viewport = document.getElementById('app-viewport');
      if (!viewport) return;

      switch (appState.route) {
        case 'dashboard':
          viewport.innerHTML = renderDashboardPage();
          break;
        case 'library':
          viewport.innerHTML = renderLibraryPage();
          break;
        case 'upload':
          viewport.innerHTML = renderUploadPage();
          break;
        case 'drive-sources':
          viewport.innerHTML = renderDriveSourcesPage();
          break;
        case 'create':
          viewport.innerHTML = renderCreateManualPage();
          break;
        case 'editor':
          viewport.innerHTML = renderEditorPage();
          break;
        case 'exam-detail':
          viewport.innerHTML = renderExamDetailPage();
          break;
        case 'exam-room':
          viewport.innerHTML = renderExamRoomPage();
          break;
        case 'result':
          viewport.innerHTML = renderResultPage();
          break;
        case 'history':
          viewport.innerHTML = renderHistoryPage();
          break;
        case 'profile':
          viewport.innerHTML = renderProfilePage();
          break;
        case 'admin':
          viewport.innerHTML = renderAdminPage();
          break;
        default:
          viewport.innerHTML = renderDashboardPage();
      }
    }

    // Keyboard Accessibility in Exam Room (Arrow Left/Right to switch question, M to flag)
    window.addEventListener('keydown', (e) => {
      if (appState.route !== 'exam-room') return;
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

      const att = db.exam_attempts.find((a) => a.id === appState.activeAttemptId);
      if (!att) return;
      const qs = db.questions
        .filter((q) => q.question_set_id === att.question_set_id)
        .sort((a, b) => a.order_index - b.order_index);
      if (qs.length === 0) return;

      if (e.key === 'ArrowRight') {
        e.preventDefault();
        jumpToRoomQuestion(Math.min(qs.length - 1, appState.activeRoomQuestionIndex + 1));
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        jumpToRoomQuestion(Math.max(0, appState.activeRoomQuestionIndex - 1));
      } else if (e.key.toLowerCase() === 'm') {
        e.preventDefault();
        const curQ = qs[appState.activeRoomQuestionIndex];
        if (curQ) toggleRoomQuestionFlag(null, curQ.id, appState.activeRoomQuestionIndex);
      }
    });

    // Restore hash route or active attempt on page reload (Section 3 & 7.4)
    window.addEventListener('DOMContentLoaded', () => {
      const hash = (window.location.hash || '').replace(/^#\/?/, '');
      const validRoutes = NAV_ITEMS.map((n) => n.id).concat(['exam-detail', 'result']);
      if (validRoutes.includes(hash)) {
        appState.route = hash;
      }

      // Khôi phục đồng hồ phiên làm bài đang diễn ra nếu tải lại trang
      const activeInProg = db.exam_attempts.find(
        (a) => a.user_id === db.currentUserId && a.status === 'in_progress'
      );
      if (activeInProg) {
        appState.activeAttemptId = activeInProg.id;
        appState.roomStatus = 'saved';
        startExamTimerLoop();
      }

      renderApp();
    });
  </script>
</body>
</html>
