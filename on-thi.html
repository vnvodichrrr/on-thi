    }

    // =========================================================================
    // 16. PAGE 7: PHÒNG LÀM BÀI TRỰC TUYẾN (EXAM ROOM - Section 7, Reference UI)
    // =========================================================================
    function startNewExamAttempt(questionSetId) {
      const check = serverFetchSafeRoomQuestions(questionSetId, db.currentUserId);
      if (check.code !== 200) {
        showToast(check.error, 'error');
        return;
      }

      const exam = check.exam;
      const attemptId = generateId('att');
      const nowMs = Date.now();
      const durSec = Number(exam.duration_seconds) || 0;
      // Nếu đề có giới hạn thời gian, yêu cầu người dùng bấm "Bắt đầu làm bài" để bắt đầu tính giờ (Mục 7.4)
      const initialStatus = durSec > 0 ? 'not_started' : 'in_progress';

      db.exam_attempts.unshift({
        id: attemptId,
        user_id: db.currentUserId,
        question_set_id: questionSetId,
        started_at: new Date(nowMs).toISOString(),
        server_deadline_at: durSec > 0 && initialStatus === 'in_progress' ? new Date(nowMs + durSec * 1000).toISOString() : null,
        submitted_at: null,
        status: initialStatus,
        score: null,
        max_score: null
      });

      persistDb();
      appState.activeAttemptId = attemptId;
      appState.activeRoomQuestionIndex = 0;
      appState.roomStatus = initialStatus;
      appState.isTimerPaused = false;
      appState.pausedRemainingSeconds = null;

      if (initialStatus === 'in_progress' && durSec > 0) {
        startExamTimerLoop();
      }
      navigateTo('exam-room', { activeAttemptId: attemptId });
    }

    function resumeAttempt(attemptId) {
      const att = db.exam_attempts.find((a) => a.id === attemptId);
      if (!att) return;
      if (att.user_id !== db.currentUserId) {
        logSecurityEvent('ACCESS_ATTEMPT', 'BLOCKED_403', `User ${db.currentUserId} cố mở lượt làm bài ${attemptId} của người khác`);
        showToast('Truy cập bị từ chối (403): Bạn không thể mở lượt làm bài của người dùng khác.', 'error');
        return;
      }
      if (att.status === 'submitted' || att.status === 'expired') {
        openResultPage(attemptId);
        return;
      }

      appState.activeAttemptId = attemptId;
      appState.roomStatus = att.status === 'not_started' ? 'not_started' : appState.simulateOffline ? 'offline' : 'saved';
      if (att.status === 'in_progress') {
        startExamTimerLoop();
      }
      navigateTo('exam-room', { activeAttemptId: attemptId });
    }

    function startActiveExamAttempt() {
      const att = db.exam_attempts.find((a) => a.id === appState.activeAttemptId);
      if (!att) return;
      const exam = db.question_sets.find((s) => s.id === att.question_set_id);
      if (!exam) return;

      const durSec = Number(exam.duration_seconds) || 0;
      const nowMs = Date.now();
      att.status = 'in_progress';
      att.started_at = new Date(nowMs).toISOString();
      att.server_deadline_at = durSec > 0 ? new Date(nowMs + durSec * 1000).toISOString() : null;
      appState.roomStatus = appState.simulateOffline ? 'offline' : 'in_progress';
      appState.isTimerPaused = false;
      persistDb();

      if (durSec > 0) startExamTimerLoop();
      showToast('Đã bắt đầu tính giờ làm bài! Chúc bạn hoàn thành tốt.', 'info');
      renderApp();
    }

    function resetNotStartedAttempt() {
      const att = db.exam_attempts.find((a) => a.id === appState.activeAttemptId);
      if (!att || att.status !== 'not_started') return;
      db.attempt_answers = db.attempt_answers.filter((a) => a.attempt_id !== att.id);
      persistDb();
      showToast('Đã đặt lại trạng thái chuẩn bị làm bài.', 'info');
      renderApp();
    }

    function togglePauseExamTimer() {
      const att = db.exam_attempts.find((a) => a.id === appState.activeAttemptId);
      if (!att || att.status !== 'in_progress') return;
      const exam = db.question_sets.find((s) => s.id === att.question_set_id);
      if (!exam || !exam.scoring_config || !exam.scoring_config.allow_pause) {
        showToast('Quy tắc đề thi này không cho phép tạm dừng đồng hồ!', 'warning');
        return;
      }

      if (!appState.isTimerPaused) {
        appState.pausedRemainingSeconds = getRemainingAttemptSeconds(att, exam);
        appState.isTimerPaused = true;
        showToast('Đã tạm dừng đồng hồ làm bài.', 'info');
      } else {
        const rem = Number(appState.pausedRemainingSeconds) || 60;
        att.server_deadline_at = new Date(Date.now() + rem * 1000).toISOString();
        appState.isTimerPaused = false;
        appState.pausedRemainingSeconds = null;
        persistDb();
        showToast('Đã tiếp tục tính giờ làm bài.', 'info');
      }
      renderApp();
    }

    function simulateFastForwardNearExpiry() {
      const att = db.exam_attempts.find((a) => a.id === appState.activeAttemptId);
      if (!att) return;
      if (att.status === 'not_started') {
        startActiveExamAttempt();
      }
      att.server_deadline_at = new Date(Date.now() + 5000).toISOString();
      appState.isTimerPaused = false;
      persistDb();
      startExamTimerLoop();
      showToast('Đã tua đồng hồ máy chủ còn 5 giây để kiểm thử tự động nộp bài khi hết giờ!', 'warning');
      renderApp();
    }

    function toggleSimulateOfflineMode() {
      appState.simulateOffline = !appState.simulateOffline;
      if (appState.simulateOffline) {
        appState.roomStatus = 'offline';
        showToast('Đang giả lập Mất kết nối mạng: Hệ thống KHÔNG báo "Đã lưu" khi chưa đồng bộ được máy chủ.', 'warning');
      } else {
        appState.roomStatus = 'saved';
        persistDb();
        showToast('Đã khôi phục kết nối mạng và đồng bộ toàn bộ câu trả lời lên máy chủ!', 'success');
      }
      renderApp();
    }

    function isAttemptAnswerFilled(q, ansRecord) {
      if (!ansRecord || ansRecord.answer_data === null || ansRecord.answer_data === undefined) return false;
      const d = ansRecord.answer_data;
      if (q.question_type === 'mcq_single' || q.question_type === 'true_false_single') {
        return typeof d === 'string' && d.trim().length > 0;
      }
      if (q.question_type === 'true_false_multi') {
        return typeof d === 'object' && Object.keys(d).some((k) => d[k] === 'TRUE' || d[k] === 'FALSE');
      }
      if (q.question_type === 'short_answer' || q.question_type === 'essay') {
        return typeof d === 'string' && d.trim().length > 0;
      }
      return false;
    }

    function renderExamRoomPage() {
      // Nếu chưa có attempt đang mở, lấy attempt gần nhất hoặc mở đề đầu tiên
      if (!appState.activeAttemptId && db.question_sets.length > 0) {
        const existingInProg = db.exam_attempts.find((a) => a.user_id === db.currentUserId && (a.status === 'in_progress' || a.status === 'not_started'));
        if (existingInProg) {
          appState.activeAttemptId = existingInProg.id;
        } else {
          const firstPub = db.question_sets.find((s) => s.publication_status === 'published') || db.question_sets[0];
          if (firstPub) {
            startNewExamAttempt(firstPub.id);
            return '';
          }
        }
      }

      const attempt = db.exam_attempts.find((a) => a.id === appState.activeAttemptId);
      if (!attempt) {
        return `
          <div class="p-8 max-w-3xl mx-auto text-center">
            <div class="bg-white rounded-xl border border-slate-200 p-8">
              <h2 class="text-base font-bold text-slate-900">Phòng làm bài chưa có đề thi nào được chọn</h2>
              <p class="text-xs text-slate-500 mt-1">Vui lòng chọn một đề từ Kho đề hoặc nạp bộ đề mẫu để mở phòng làm bài trực tuyến.</p>
              <div class="mt-4 flex justify-center gap-3">
                <button type="button" onclick="navigateTo('library')" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-xs font-semibold">Mở Kho đề</button>
                <button type="button" onclick="seedSampleExamsForQuickDemo()" class="px-4 py-2 rounded-lg bg-emerald-600 text-white text-xs font-semibold">Nạp bộ đề mẫu</button>
              </div>
            </div>
          </div>
        `;
      }

      const roomPayload = serverFetchSafeRoomQuestions(attempt.question_set_id, db.currentUserId);
      if (roomPayload.code !== 200) {
        appState.roomStatus = 'load_error';
        return `
          <div class="p-8 max-w-3xl mx-auto">
            <div class="bg-red-50 rounded-xl border border-red-200 p-6 text-center">
              <h2 class="text-base font-bold text-red-800">Không thể tải câu hỏi phòng thi (${roomPayload.code})</h2>
              <p class="text-xs text-red-700 mt-1">${escapeHtml(roomPayload.error)}</p>
              <button type="button" onclick="navigateTo('library')" class="mt-4 px-4 py-2 rounded-lg bg-white border border-red-300 text-red-700 text-xs font-semibold">Quay lại Kho đề</button>
            </div>
          </div>
        `;
      }

      const exam = roomPayload.exam;
      const questions = roomPayload.questions;
      const isLocked = attempt.status !== 'in_progress' || appState.isTimerPaused;
      const user = getCurrentUser();

      const attemptAnswers = db.attempt_answers.filter((a) => a.attempt_id === attempt.id);
      const ansMap = {};
      attemptAnswers.forEach((a) => {
        ansMap[a.question_id] = a;
      });

      const totalCount = questions.length;
      const answeredCount = questions.filter((q) => isAttemptAnswerFilled(q, ansMap[q.id])).length;
      const unansweredCount = totalCount - answeredCount;
      const flaggedCount = questions.filter((q) => ansMap[q.id] && ansMap[q.id].is_flagged).length;

      const rightNavigatorHtml = renderQuestionNavigatorCard(exam, attempt, questions, ansMap, totalCount, answeredCount, unansweredCount, flaggedCount);

      // Update mobile drawer content as well
      setTimeout(() => {
        const mobQNav = document.getElementById('mobile-qnav-content');
        if (mobQNav) mobQNav.innerHTML = rightNavigatorHtml;
      }, 0);

      return `
        <div class="flex-1 flex flex-col lg:flex-row max-w-[1440px] w-full mx-auto p-3 sm:p-5 gap-5 items-start">

          <!-- CENTER QUESTION AREA (Section 7.2) -->
          <div class="flex-1 min-w-0 w-full space-y-4">

            <!-- Exam Info & Progress Top Strip (Section 7.5) -->

                  <div class="flex flex-wrap items-center gap-2 text-xs text-slate-600">
                    <span>Người làm bài: <strong class="text-slate-900">${escapeHtml(user.display_name)}</strong> (${escapeHtml(user.email)})</span>
                    <span>•</span>
                    <span>Môn: <strong class="text-slate-900">${escapeHtml(exam.subject)}</strong></span>
                    <span>•</span>
                    <span>Thời lượng: <strong class="text-slate-900">${exam.duration_seconds > 0 ? Math.round(exam.duration_seconds / 60) + ' phút' : 'Không giới hạn'}</strong></span>
                  </div>
                  <div class="mt-2 flex items-center gap-3">
                    <div class="flex-1 sm:w-64 h-2 bg-slate-100 rounded-full overflow-hidden">
                      <div class="h-full bg-blue-600 transition-all duration-200" style="width: ${totalCount > 0 ? Math.round((answeredCount / totalCount) * 100) : 0}%"></div>

                    <span class="text-xs font-semibold text-slate-700">Tiến độ: ${answeredCount}/${totalCount} câu</span>
                  </div>
                </div>

                <!-- Simulation & View Mode Controls -->
                <div class="flex flex-wrap items-center gap-2 shrink-0">
                  <button type="button" onclick="toggleRoomViewMode()" class="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 text-xs font-medium hover:bg-slate-100">
                    ${appState.roomViewMode === 'all' ? 'Chế độ: Từng câu' : 'Chế độ: Tất cả câu'}
                  </button>
                  <button type="button" onclick="toggleSimulateOfflineMode()"
                    class="px-2.5 py-1.5 rounded-lg border text-xs font-medium ${
                      appState.simulateOffline
                        ? 'border-red-300 bg-red-50 text-red-700 font-semibold'
                        : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'
                    }" title="Kiểm thử kịch bản mất kết nối mạng khi đang làm bài">
                    ${appState.simulateOffline ? '⚡ Đang giả lập Mất mạng (Bấm để nối lại)' : 'Giả lập mất kết nối'}
                  </button>
                  ${

                        </button>`

                </div>

                    </button>
                  </div>

              }

              ${
                appState.simulateOffline
                  ? `
                  <div class="mt-3 p-3 rounded-lg bg-red-50 border border-red-200 text-xs text-red-800 flex items-center justify-between gap-2">
                    <span><strong>Cảnh báo mất kết nối:</strong> Các thay đổi hiện chỉ lưu tạm ở trình duyệt, chưa đồng bộ lên máy chủ (Không hiển thị "Đã lưu").</span>
                    <button type="button" onclick="toggleSimulateOfflineMode()" class="px-2.5 py-1 rounded bg-red-600 text-white font-semibold shrink-0">Kết nối lại</button>
                  </div>
                `
                  : ''
              }
            </div>

            <!-- Question Cards List -->
            <div class="space-y-4">
              ${questions
                .map((q, idx) => {
                  if (appState.roomViewMode === 'single' && idx !== appState.activeRoomQuestionIndex) {
                    return '';
                  }
                  return renderSingleRoomQuestionCard(q, idx, ansMap[q.id], isLocked);
                })
                .join('')}
            </div>

            <!-- Single-Question Mode Prev/Next Footer -->
            ${
              appState.roomViewMode === 'single'
                ? `
                <div class="bg-white rounded-xl border border-slate-200 p-3.5 flex items-center justify-between">
                  <button type="button" onclick="jumpToRoomQuestion(${Math.max(0, appState.activeRoomQuestionIndex - 1)})"
                    ${appState.activeRoomQuestionIndex === 0 ? 'disabled' : ''}
                    class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold disabled:opacity-40">
                    ← Câu trước
                  </button>
                  <span class="text-xs font-semibold text-slate-600">Câu ${appState.activeRoomQuestionIndex + 1} / ${totalCount}</span>
                  <button type="button" onclick="jumpToRoomQuestion(${Math.min(totalCount - 1, appState.activeRoomQuestionIndex + 1)})"
                    ${appState.activeRoomQuestionIndex >= totalCount - 1 ? 'disabled' : ''}
                    class="px-4 py-2 rounded-lg bg-blue-600 text-white text-xs font-semibold disabled:opacity-40">
                    Câu tiếp theo →
                  </button>

                : ''

          </div>

          <!-- RIGHT QUESTION NAVIGATOR PANEL (Desktop Sticky Card - Section 7.3) -->

        </div>

    function renderSingleRoomQuestionCard(q, idx, ansRecord, isLocked) {
      const isCurrent = appState.activeRoomQuestionIndex === idx;
      const isFlagged = Boolean(ansRecord && ansRecord.is_flagged);
      const isAnswered = isAttemptAnswerFilled(q, ansRecord);
      const userAnswer = ansRecord ? ansRecord.answer_data : null;

      let interactionHtml = '';

      if (q.question_type === 'mcq_single') {
        interactionHtml = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mt-3">
            ${(q.options || [])
              .map((opt) => {
                const selected = userAnswer === opt.label;
                return `
                  <button type="button"
                    onclick="selectRoomMcqOption('${q.id}', ${idx}, '${opt.label}')"
                    class="p-3 rounded-xl border text-left flex items-start gap-3 transition-all ${
                      selected
                        ? 'border-blue-600 bg-blue-50/90 ring-1 ring-blue-600 text-slate-900'
                        : 'border-slate-200 bg-white hover:border-blue-300 hover:bg-slate-50/70 text-slate-800'
                    }">
                    <span class="w-7 h-7 rounded-lg font-bold text-xs flex items-center justify-center shrink-0 ${
                      selected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700 border border-slate-200'
                    }">${escapeHtml(opt.label)}</span>
                    <span class="text-xs sm:text-sm font-medium leading-snug pt-0.5">${formatMathText(opt.content)}</span>
                  </button>
                `;
              })
              .join('')}
          </div>
        `;
      } else if (q.question_type === 'true_false_single') {
        const selTrue = userAnswer === 'TRUE';
        const selFalse = userAnswer === 'FALSE';
        interactionHtml = `
          <div class="grid grid-cols-2 gap-3 mt-3 max-w-md">
            <button type="button" onclick="selectRoomTfSingle('${q.id}', ${idx}, 'TRUE')"
              class="py-3 px-4 rounded-xl border text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition-all ${
                selTrue ? 'border-blue-600 bg-blue-50 text-blue-800 ring-1 ring-blue-600' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'
              }">
              <span class="w-5 h-5 rounded-full border flex items-center justify-center text-[11px] ${selTrue ? 'bg-blue-600 text-white border-blue-600' : 'border-slate-300'}">Đ</span>
              <span>Đúng</span>
            </button>
            <button type="button" onclick="selectRoomTfSingle('${q.id}', ${idx}, 'FALSE')"
              class="py-3 px-4 rounded-xl border text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition-all ${
                selFalse ? 'border-blue-600 bg-blue-50 text-blue-800 ring-1 ring-blue-600' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'
              }">
              <span class="w-5 h-5 rounded-full border flex items-center justify-center text-[11px] ${selFalse ? 'bg-blue-600 text-white border-blue-600' : 'border-slate-300'}">S</span>
              <span>Sai</span>
            </button>
          </div>
        `;
      } else if (q.question_type === 'true_false_multi') {
        const curMap = userAnswer && typeof userAnswer === 'object' ? userAnswer : {};
        interactionHtml = `
          <div class="mt-3 border border-slate-200 rounded-xl overflow-hidden divide-y divide-slate-200">
            <div class="bg-slate-50 px-3.5 py-2 text-[11px] font-semibold text-slate-600 flex items-center justify-between">
              <span>Các nhận định cần xét Đúng / Sai</span>
              <span>Trạng thái lựa chọn từng ý</span>
            </div>
            ${(q.options || [])
              .map((st) => {
                const chosen = curMap[st.label];
                const isStatementAnswered = chosen === 'TRUE' || chosen === 'FALSE';
                return `
                  <div class="p-3 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                    <div class="text-xs sm:text-sm text-slate-800 leading-relaxed flex items-start gap-2">
                      <span class="font-bold text-slate-900 shrink-0">${escapeHtml(st.label)})</span>
                      <span>${formatMathText(st.content)}</span>
                    </div>
                    <div class="flex items-center gap-2 shrink-0 self-end sm:self-center">
                      <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${
                        isStatementAnswered ? 'bg-blue-50 text-blue-700' : 'bg-slate-100 text-slate-500'
                      }">
                        ${isStatementAnswered ? 'Đã chọn' : 'Còn trống'}
                      </span>
                      <button type="button" onclick="selectRoomTfMulti('${q.id}', ${idx}, '${st.label}', 'TRUE')"
                        class="px-3 py-1.5 rounded-lg border text-xs font-semibold transition-colors ${
                          chosen === 'TRUE'
                            ? 'bg-blue-600 text-white border-blue-600'
                            : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'
                        }">Đúng</button>
                      <button type="button" onclick="selectRoomTfMulti('${q.id}', ${idx}, '${st.label}', 'FALSE')"
                        class="px-3 py-1.5 rounded-lg border text-xs font-semibold transition-colors ${
                          chosen === 'FALSE'
                            ? 'bg-blue-600 text-white border-blue-600'
                            : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'
                        }">Sai</button>
                    </div>
                  </div>
                `;
              })
              .join('')}
          </div>
        `;
      } else if (q.question_type === 'short_answer') {
        interactionHtml = `
          <div class="mt-3 max-w-md">
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nhập câu trả lời ngắn của bạn:</label>
            <div class="flex items-center gap-2">
              <input type="text" value="${escapeHtml(userAnswer || '')}"
                oninput="inputRoomShortAnswer('${q.id}', ${idx}, this.value)"
                placeholder="Nhập số hoặc đáp án ngắn..."
                class="flex-1 px-3.5 py-2.5 rounded-xl border ${
                  isAnswered ? 'border-blue-600 bg-blue-50/30' : 'border-slate-300 bg-white'
                } text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500" />
              ${
                q.unit_label
                  ? `<span class="px-3 py-2.5 rounded-xl bg-slate-100 border border-slate-200 text-xs font-semibold text-slate-700 shrink-0">${escapeHtml(q.unit_label)}</span>`
                  : ''
              }
            </div>
          </div>
        `;
      } else {
        interactionHtml = `
          <div class="mt-3">
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nhập bài làm tự luận (Sẽ được lưu để giáo viên chấm thủ công):</label>
            <textarea rows="4" oninput="inputRoomShortAnswer('${q.id}', ${idx}, this.value)"
              placeholder="Trình bày lời giải của bạn tại đây..."
              class="w-full px-3.5 py-2.5 rounded-xl border ${
                isAnswered ? 'border-blue-600 bg-blue-50/20' : 'border-slate-300 bg-white'
              } text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">${escapeHtml(userAnswer || '')}</textarea>
          </div>
        `;
      }

      return `
        <div id="room-question-card-${idx}"
          onclick="setActiveQuestionFocus(${idx})"
          class="bg-white rounded-xl border ${
            isCurrent ? 'border-blue-600 ring-1 ring-blue-600/40' : 'border-slate-200'
          } p-4 sm:p-5 shadow-sm transition-all">

          <!-- Question Card Header -->
          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
            <div class="flex flex-wrap items-center gap-2">
              <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${
                isFlagged
                  ? 'bg-amber-400 text-slate-950'
                  : isAnswered
                  ? 'bg-blue-600 text-white'
                  : 'bg-slate-100 text-slate-800'
              }">Câu ${q.order_index}</span>
              <span class="text-xs font-medium text-slate-500">${escapeHtml(q.part_name || 'Phần I')}</span>
              <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-[11px] font-medium">${Number(q.points || 1).toFixed(2)} điểm</span>
            </div>

            <div class="flex items-center gap-2">
              ${
                isAnswered
                  ? `<button type="button" onclick="clearRoomQuestionAnswer(event, '${q.id}', ${idx})"
                      class="px-2.5 py-1 rounded-lg border border-slate-200 text-slate-500 hover:text-red-600 hover:bg-red-50 text-xs font-medium">
                      Xóa lựa chọn
                    </button>`
                  : ''
              }
              <button type="button" onclick="toggleRoomQuestionFlag(event, '${q.id}', ${idx})"
                class="px-2.5 py-1 rounded-lg border text-xs font-semibold flex items-center gap-1 transition-colors ${
                  isFlagged
                    ? 'bg-amber-400 text-slate-950 border-amber-500'
                    : 'bg-white text-slate-600 border-slate-200 hover:bg-amber-50 hover:text-amber-800'
                }">
                <span>⚑</span>
                <span>${isFlagged ? 'Đã đánh dấu xem lại' : 'Đánh dấu xem lại'}</span>
              </button>
            </div>
          </div>

          <!-- Question Stem + Formula + Media -->
          <div class="mt-3 text-sm text-slate-900 leading-relaxed font-medium">
            ${formatMathText(q.content)}
          </div>

          ${renderMediaAttachmentBox(q.media_attachment)}

          <!-- Answer Options / Inputs -->
          <div class="${isLocked ? 'opacity-70' : ''}">
            ${interactionHtml}
          </div>
        </div>
      `;
    }

    // Right Question Navigator Card (Section 7.3 — Blue: Answered, White/Light-gray: Unanswered, Yellow: Flagged, Prominent border: Current)
    function renderQuestionNavigatorCard(exam, attempt, questions, ansMap, totalCount, answeredCount, unansweredCount, flaggedCount) {
      return `
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm space-y-4">
          <div class="flex items-center justify-between border-b border-slate-200 pb-3">
            <h3 class="text-sm font-bold text-slate-900">Bảng điều hướng câu hỏi</h3>
            <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 text-xs font-semibold">${totalCount} câu</span>
          </div>

          <!-- 4 Summary Counters -->
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="p-2.5 rounded-lg bg-blue-50/80 border border-blue-200 flex items-center justify-between">
              <span class="text-blue-800 font-medium">Đã trả lời</span>
              <span id="nav-stat-answered" class="font-bold text-blue-700 text-sm">${answeredCount}</span>
            </div>
            <div class="p-2.5 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-between">
              <span class="text-slate-600 font-medium">Chưa trả lời</span>
              <span id="nav-stat-unanswered" class="font-bold text-slate-800 text-sm">${unansweredCount}</span>
            </div>
            <div class="p-2.5 rounded-lg bg-amber-50 border border-amber-200 flex items-center justify-between col-span-2">
              <span class="text-amber-900 font-medium">Đánh dấu xem lại</span>
              <span id="nav-stat-flagged" class="font-bold text-amber-800 text-sm">${flaggedCount}</span>
            </div>
          </div>

          <!-- Number Buttons Grid -->
          <div>
            <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2">Danh sách số thứ tự câu</div>
            <div class="grid grid-cols-5 gap-2">
              ${questions
                .map((q, idx) => {
                  const ansRecord = ansMap[q.id];
                  const isAnswered = isAttemptAnswerFilled(q, ansRecord);
                  const isFlagged = Boolean(ansRecord && ansRecord.is_flagged);
                  const isCurrent = appState.activeRoomQuestionIndex === idx;

                  // Màu sắc chuẩn theo Mục 7.3:
                  // Vàng: được đánh dấu xem lại | Xanh dương: đã trả lời | Trắng/Xám nhạt: chưa trả lời | Viền nổi bật: trạng thái hiện tại
                  let btnCls = 'bg-slate-50 text-slate-700 border border-slate-300 hover:bg-slate-100';
                  if (isFlagged) {
                    btnCls = 'bg-amber-400 text-slate-950 font-bold border border-amber-500';
                  } else if (isAnswered) {
                    btnCls = 'bg-blue-600 text-white font-semibold border border-blue-600';
                  }
                  if (isCurrent) {
                    btnCls += ' ring-2 ring-blue-600 ring-offset-2';
                  }

                  return `
                    <button type="button"
                      onclick="jumpToRoomQuestion(${idx})"
                      class="h-9 rounded-lg text-xs flex items-center justify-center transition-all ${btnCls}"
                      title="Câu ${q.order_index}: ${isFlagged ? 'Đánh dấu xem lại' : isAnswered ? 'Đã trả lời' : 'Chưa trả lời'}">
                      ${q.order_index}
                    </button>
                  `;
                })
                .join('')}
            </div>
          </div>

          <!-- Color Legend -->
          <div class="pt-3 border-t border-slate-200 grid grid-cols-2 gap-2 text-[11px] text-slate-600">
            <div class="flex items-center gap-1.5">
              <span class="w-3.5 h-3.5 rounded bg-blue-600 inline-block"></span>
              <span>Đã trả lời</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="w-3.5 h-3.5 rounded bg-slate-50 border border-slate-300 inline-block"></span>
              <span>Chưa trả lời</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="w-3.5 h-3.5 rounded bg-amber-400 border border-amber-500 inline-block"></span>
              <span>Đánh dấu xem lại</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="w-3.5 h-3.5 rounded border-2 border-blue-600 inline-block"></span>
              <span>Câu hiện tại</span>
            </div>
          </div>

          <!-- Submit Button (Section 7.6) -->
          <div class="pt-2">
            <button type="button"
              id="exam-submit-main-btn"
              onclick="openSubmitExamConfirmation()"
              ${appState.roomStatus === 'submitting' || attempt.status === 'submitted' ? 'disabled' : ''}
              class="w-full py-3 rounded-xl bg-blue-600 text-white text-sm font-bold hover:bg-blue-700 shadow-sm transition-colors disabled:opacity-50">
              ${appState.roomStatus === 'submitting' ? 'Đang nộp bài...' : 'Nộp bài'}
            </button>
          </div>
        </div>
      `;
    }

    function setActiveQuestionFocus(idx) {
      if (appState.activeRoomQuestionIndex === idx) return;
      appState.activeRoomQuestionIndex = idx;
      renderApp();
    }

    function jumpToRoomQuestion(idx) {
      appState.activeRoomQuestionIndex = idx;
      toggleMobileQNav(false);
      renderApp();
      setTimeout(() => {
        const card = document.getElementById('room-question-card-' + idx);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 40);
    }

    function toggleRoomViewMode() {
      appState.roomViewMode = appState.roomViewMode === 'all' ? 'single' : 'all';
      renderApp();
    }

    // Room Answer Interaction Handlers (Synchronizes Navigator Immediately)
    function ensureAttemptStartedBeforeAnswering() {
      const att = db.exam_attempts.find((a) => a.id === appState.activeAttemptId);
      if (!att) return null;
      if (att.status === 'submitted' || att.status === 'expired') {
        showToast('Lượt làm bài đã kết thúc và bị khóa chỉnh sửa!', 'error');
        return null;
      }
      if (appState.isTimerPaused) {
        showToast('Đồng hồ đang tạm dừng. Hãy bấm "Tiếp tục" để trả lời câu hỏi.', 'warning');
        return null;
      }
      if (att.status === 'not_started') {
        startActiveExamAttempt();
      }
      return att;
    }

    function getOrCreateAttemptAnswerRecord(attemptId, questionId) {
      let rec = db.attempt_answers.find((a) => a.attempt_id === attemptId && a.question_id === questionId);
      if (!rec) {
        rec = {
          id: generateId('ans'),
          attempt_id: attemptId,
          question_id: questionId,
          answer_data: null,
          is_flagged: false,
          awarded_score: null,
          grading_status: 'pending',
          answered_at: new Date().toISOString()
        };
        db.attempt_answers.push(rec);
      }
      return rec;
    }

    function triggerRoomSaveCycle() {
      if (appState.simulateOffline) {
        // Khi mất kết nối: tuyệt đối không hiển thị thông báo "Đã lưu" (Mục 7.7)
        appState.roomStatus = 'offline';
        renderTopHeader();
        return;
      }
      appState.roomStatus = 'saving';
      renderTopHeader();
      const ok = safeSaveStorage(db);
      setTimeout(() => {
        if (!appState.simulateOffline && appState.route === 'exam-room') {
          appState.roomStatus = ok ? 'saved' : 'offline';
          renderTopHeader();
        }
      }, 150);
    }

    function selectRoomMcqOption(questionId, idx, optionLabel) {
      const att = ensureAttemptStartedBeforeAnswering();
      if (!att) return;
      appState.activeRoomQuestionIndex = idx;
      const rec = getOrCreateAttemptAnswerRecord(att.id, questionId);
      rec.answer_data = optionLabel;
      rec.answered_at = new Date().toISOString();
      triggerRoomSaveCycle();
      renderApp();
    }

    function selectRoomTfSingle(questionId, idx, val) {
      const att = ensureAttemptStartedBeforeAnswering();
      if (!att) return;
      appState.activeRoomQuestionIndex = idx;
      const rec = getOrCreateAttemptAnswerRecord(att.id, questionId);
      rec.answer_data = val;
      rec.answered_at = new Date().toISOString();
      triggerRoomSaveCycle();
      renderApp();
    }

    function selectRoomTfMulti(questionId, idx, statementKey, val) {
      const att = ensureAttemptStartedBeforeAnswering();
      if (!att) return;
      appState.activeRoomQuestionIndex = idx;
      const rec = getOrCreateAttemptAnswerRecord(att.id, questionId);
      if (!rec.answer_data || typeof rec.answer_data !== 'object') {
        rec.answer_data = {};
      }
      rec.answer_data[statementKey] = val;
      rec.answered_at = new Date().toISOString();
      triggerRoomSaveCycle();
      renderApp();
    }

    function inputRoomShortAnswer(questionId, idx, textVal) {
      const att = ensureAttemptStartedBeforeAnswering();
      if (!att) return;
      appState.activeRoomQuestionIndex = idx;
      const rec = getOrCreateAttemptAnswerRecord(att.id, questionId);
      rec.answer_data = textVal;
      rec.answered_at = new Date().toISOString();
      triggerRoomSaveCycle();
      // Update navigator counters and button colors without losing input focus
      updateNavigatorDomInPlace(att);
    }

    function updateNavigatorDomInPlace(attempt) {
      const questions = db.questions
        .filter((q) => q.question_set_id === attempt.question_set_id)
        .sort((a, b) => a.order_index - b.order_index);
      const attemptAnswers = db.attempt_answers.filter((a) => a.attempt_id === attempt.id);
      const ansMap = {};
      attemptAnswers.forEach((a) => {
        ansMap[a.question_id] = a;
      });
      const totalCount = questions.length;
      const answeredCount = questions.filter((q) => isAttemptAnswerFilled(q, ansMap[q.id])).length;
      const unansweredCount = totalCount - answeredCount;
      const flaggedCount = questions.filter((q) => ansMap[q.id] && ansMap[q.id].is_flagged).length;

      const elAns = document.getElementById('nav-stat-answered');
      const elUnans = document.getElementById('nav-stat-unanswered');
      const elFlag = document.getElementById('nav-stat-flagged');
      if (elAns) elAns.textContent = String(answeredCount);
      if (elUnans) elUnans.textContent = String(unansweredCount);
      if (elFlag) elFlag.textContent = String(flaggedCount);
    }

    function clearRoomQuestionAnswer(event, questionId, idx) {
      if (event) event.stopPropagation();
      const att = ensureAttemptStartedBeforeAnswering();
      if (!att) return;
      appState.activeRoomQuestionIndex = idx;
      const rec = getOrCreateAttemptAnswerRecord(att.id, questionId);
      rec.answer_data = null;
      rec.answered_at = new Date().toISOString();
      triggerRoomSaveCycle();
      renderApp();
    }

    function toggleRoomQuestionFlag(event, questionId, idx) {
      if (event) event.stopPropagation();
      const att = db.exam_attempts.find((a) => a.id === appState.activeAttemptId);
      if (!att || att.status === 'submitted' || att.status === 'expired') return;
      appState.activeRoomQuestionIndex = idx;
      const rec = getOrCreateAttemptAnswerRecord(att.id, questionId);
      rec.is_flagged = !rec.is_flagged;
      triggerRoomSaveCycle();
      renderApp();
    }

    // Submit Exam Flow (Section 7.6)
    function openSubmitExamConfirmation() {
      const att = db.exam_attempts.find((a) => a.id === appState.activeAttemptId);
      if (!att) return;
      if (att.status === 'submitted' || att.status === 'expired') {
        showToast('Lượt làm bài này đã được nộp trước đó!', 'warning');
        return;
      }

      const questions = db.questions.filter((q) => q.question_set_id === att.question_set_id);
      const ansList = db.attempt_answers.filter((a) => a.attempt_id === att.id);
      const ansMap = {};
      ansList.forEach((a) => {
        ansMap[a.question_id] = a;
      });

      const totalCount = questions.length;
      const answeredCount = questions.filter((q) => isAttemptAnswerFilled(q, ansMap[q.id])).length;
      const unansweredCount = totalCount - answeredCount;
      const flaggedCount = questions.filter((q) => ansMap[q.id] && ansMap[q.id].is_flagged).length;

      openAppModal({
        title: 'Xác nhận nộp bài thi',
        html: `
          <div class="space-y-3">
            <p class="text-xs text-slate-600">Vui lòng kiểm tra lại thống kê bài làm trước khi xác nhận nộp bài:</p>
            <div class="grid grid-cols-3 gap-2.5 text-center">
              <div class="p-3 rounded-lg bg-blue-50 border border-blue-200">
                <div class="text-lg font-bold text-blue-700">${answeredCount}</div>
                <div class="text-[11px] text-blue-800 font-medium">Câu đã trả lời</div>
              </div>
              <div class="p-3 rounded-lg ${unansweredCount > 0 ? 'bg-red-50 border-red-200' : 'bg-slate-50 border-slate-200'} border">
                <div class="text-lg font-bold ${unansweredCount > 0 ? 'text-red-600' : 'text-slate-700'}">${unansweredCount}</div>
                <div class="text-[11px] text-slate-600 font-medium">Câu chưa trả lời</div>
              </div>
              <div class="p-3 rounded-lg bg-amber-50 border border-amber-200">
                <div class="text-lg font-bold text-amber-800">${flaggedCount}</div>
                <div class="text-[11px] text-amber-900 font-medium">Câu đánh dấu</div>
              </div>
            </div>
            ${
              unansweredCount > 0
                ? `<div class="p-3 rounded-lg bg-amber-50 border border-amber-200 text-xs text-amber-900">
                    Bạn vẫn còn <strong>${unansweredCount} câu chưa trả lời</strong>. Bạn có thể bấm "Quay lại làm tiếp" để hoàn thành nốt.
                  </div>`
                : `<div class="p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-xs text-emerald-800">
                    Bạn đã hoàn thành toàn bộ ${totalCount}/${totalCount} câu hỏi trong đề.
                  </div>`
            }
            <p class="text-[11px] text-slate-500">Sau khi nộp bài thành công, hệ thống sẽ khóa chỉnh sửa lượt làm bài này và thực hiện chấm điểm phía máy chủ.</p>
          </div>
        `,
        cancelText: 'Quay lại làm tiếp',
        confirmText: 'Xác nhận Nộp bài',
        onConfirm: () => {
          executeServerSubmission(att.id, false);
        }
      });
    }

    function executeServerSubmission(attemptId, isExpiredAutoSubmit) {
      const att = db.exam_attempts.find((a) => a.id === attemptId);
      if (!att) return { ok: false, code: 404, error: 'Không tìm thấy lượt làm bài.' };

      // Chống nộp bài 2 lần (Double Submit Prevention - Section 7.6 & Test 14)
      if (att.status === 'submitted' || att.status === 'expired' || appState.roomStatus === 'submitting') {
        logSecurityEvent('DOUBLE_SUBMIT_PREVENTED', 'BLOCKED_409', `Chặn nộp bài trùng lặp cho attempt ${attemptId}`);
        showToast('Lượt làm bài này đã được nộp, hệ thống đã chặn gửi bài trùng lặp!', 'warning');
        return { ok: false, code: 409, error: 'Lượt làm bài đã được nộp trước đó.' };
      }

      if (att.user_id !== db.currentUserId) {
        logSecurityEvent('SUBMIT_FOREIGN_ATTEMPT', 'BLOCKED_403', `User ${db.currentUserId} cố nộp bài của ${att.user_id}`);
        return { ok: false, code: 403, error: 'Không có quyền nộp bài của người dùng khác.' };
      }

      appState.roomStatus = 'submitting';
      stopExamTimerLoop();

      const exam = db.question_sets.find((s) => s.id === att.question_set_id);
      const questions = db.questions
        .filter((q) => q.question_set_id === att.question_set_id)
        .sort((a, b) => a.order_index - b.order_index);

      let totalAwarded = 0;
      let totalMax = 0;
      let countCorrect = 0;
      let countPartial = 0;
      let countIncorrect = 0;
      let countUnanswered = 0;
      let countUnverified = 0;
      let countManual = 0;
      const partScores = {};

      questions.forEach((q) => {
        const ak = db.answer_keys.find((k) => k.question_id === q.id);
        const ansRec = getOrCreateAttemptAnswerRecord(att.id, q.id);
        const grade = serverGradeSingleQuestion(q, ak, ansRec.answer_data, exam ? exam.scoring_config : {});

        ansRec.awarded_score = grade.awardedScore;
        ansRec.grading_status = grade.gradingStatus;
        ansRec.status_label = grade.statusLabel;
        ansRec.detail_breakdown = grade.detailBreakdown;

        // Chỉ cộng vào mẫu số điểm tối đa tự động đối với câu có đáp án xác minh
        if (grade.gradingStatus !== 'unverified_key') {
          totalMax += grade.maxScore;
          totalAwarded += grade.awardedScore;
        }

        if (grade.gradingStatus === 'correct') countCorrect++;
        else if (grade.gradingStatus === 'partial') countPartial++;
        else if (grade.gradingStatus === 'incorrect') countIncorrect++;
        else if (grade.gradingStatus === 'unanswered') countUnanswered++;
        else if (grade.gradingStatus === 'unverified_key') countUnverified++;
        else if (grade.gradingStatus === 'manual_pending') countManual++;

        const pName = q.part_name || 'Phần chung';
        if (!partScores[pName]) {
          partScores[pName] = { awarded: 0, max: 0, count: 0 };
        }
        partScores[pName].count++;
        if (grade.gradingStatus !== 'unverified_key') {
          partScores[pName].awarded = Number((partScores[pName].awarded + grade.awardedScore).toFixed(2));
          partScores[pName].max = Number((partScores[pName].max + grade.maxScore).toFixed(2));
        }
      });

      att.status = isExpiredAutoSubmit ? 'expired' : 'submitted';
      att.submitted_at = new Date().toISOString();
      att.score = Number(totalAwarded.toFixed(2));
      att.max_score = Number(totalMax.toFixed(2));
      att.summary_stats = {
        countCorrect,
        countPartial,
        countIncorrect,
        countUnanswered,
        countUnverified,
        countManual,
        partScores
      };

      // Lock score object properties against client tampering
      persistDb();
      appState.roomStatus = 'submitted';
      appState.viewingAttemptId = att.id;
      showToast('Đã nộp bài và chấm điểm hoàn tất!', 'success');
      navigateTo('result', { viewingAttemptId: att.id });
      return { ok: true, code: 200, score: att.score, maxScore: att.max_score };
    }

    function renderResultQuestionReviewCard(q, opts, ansRec, ak, showOfficialKey) {
      const status = (ansRec && ansRec.grading_status) || 'unanswered';
      const awarded = ansRec && ansRec.awarded_score !== null ? Number(ansRec.awarded_score).toFixed(2) : '0.00';
      const maxPts = Number(q.points || 1).toFixed(2);
      const userAnswer = ansRec ? ansRec.answer_data : null;

      const statusBadgeMap = {
        correct: { label: '✓ Chính xác', cls: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
        partial: { label: '◐ Đúng một phần', cls: 'bg-blue-100 text-blue-800 border-blue-300' },
        incorrect: { label: '✕ Chưa chính xác', cls: 'bg-red-100 text-red-800 border-red-300' },
        unanswered: { label: '○ Chưa trả lời', cls: 'bg-slate-100 text-slate-700 border-slate-300' },
        unverified_key: { label: '⚠ Chưa có đáp án xác minh', cls: 'bg-amber-100 text-amber-900 border-amber-300' },
        manual_pending: { label: '✎ Cần chấm thủ công', cls: 'bg-indigo-100 text-indigo-800 border-indigo-300' }
      };
      const badge = statusBadgeMap[status] || statusBadgeMap.unanswered;

      let detailComparisonHtml = '';

      // Đối với câu chưa có đáp án xác minh: hiển thị rõ "Chưa có đáp án xác minh" và không tự gán điểm đúng/sai (Mục 8)
      if (status === 'unverified_key') {
        detailComparisonHtml = `
          <div class="mt-3 p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-900 space-y-1">
            <div class="font-bold">Trạng thái: Chưa có đáp án xác minh</div>
            <div>Câu trả lời của bạn: <strong>${escapeHtml(userAnswer ? JSON.stringify(userAnswer) : 'Chưa trả lời')}</strong></div>
            <div class="text-[11px] text-amber-800">Hệ thống không tự gán điểm Đúng/Sai cho câu hỏi chưa được xác minh đáp án chính thức.</div>
          </div>
        `;
      } else if (q.question_type === 'mcq_single') {
        const officialVal = ak && ak.correct_answer ? ak.correct_answer.value : null;
        detailComparisonHtml = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-3">
            ${opts
              .map((o) => {
                const isUserChoice = userAnswer === o.label;
                const isCorrectChoice = showOfficialKey && officialVal === o.label;
                let boxCls = 'border-slate-200 bg-white text-slate-700';
                if (isCorrectChoice) boxCls = 'border-emerald-500 bg-emerald-50/80 text-emerald-950 font-semibold';
                else if (isUserChoice && !isCorrectChoice) boxCls = 'border-red-400 bg-red-50 text-red-900';

                return `
                  <div class="p-2.5 rounded-lg border text-xs flex items-center justify-between gap-2 ${boxCls}">
                    <div class="flex items-center gap-2">
                      <span class="w-6 h-6 rounded font-bold flex items-center justify-center ${
                        isCorrectChoice ? 'bg-emerald-600 text-white' : isUserChoice ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-700'
                      }">${escapeHtml(o.label)}</span>
                      <span>${formatMathText(o.content)}</span>
                    </div>
                    <div class="text-[10px] font-bold shrink-0">
                      ${isCorrectChoice && isUserChoice ? '✓ Bạn chọn đúng' : isCorrectChoice ? '✓ Đáp án đúng' : isUserChoice ? '✕ Bạn đã chọn' : ''}
                    </div>
                  </div>
                `;
              })
              .join('')}
          </div>
        `;
      } else if (q.question_type === 'true_false_multi') {
        const officialMap = (ak && ak.correct_answer && ak.correct_answer.statements) || {};
        const userMap = userAnswer && typeof userAnswer === 'object' ? userAnswer : {};
        detailComparisonHtml = `
          <div class="mt-3 border border-slate-200 rounded-xl overflow-hidden divide-y divide-slate-200 text-xs">
            ${opts
              .map((st) => {
                const uChoice = userMap[st.label];
                const expBool = officialMap[st.label];
                const uBool = uChoice === 'TRUE' ? true : uChoice === 'FALSE' ? false : null;
                const isMatch = uBool !== null && uBool === expBool;
                return `
                  <div class="p-2.5 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <div><strong>${escapeHtml(st.label)})</strong> ${formatMathText(st.content)}</div>
                    <div class="flex items-center gap-2 shrink-0">
                      <span class="px-2 py-0.5 rounded border ${
                        uBool === null
                          ? 'bg-slate-50 text-slate-500 border-slate-200'
                          : isMatch
                          ? 'bg-emerald-50 text-emerald-700 border-emerald-200 font-semibold'
                          : 'bg-red-50 text-red-700 border-red-200 font-semibold'
                      }">
                        Bạn chọn: ${uBool === null ? 'Bỏ trống' : uBool ? 'Đúng' : 'Sai'}
                      </span>
                      ${
                        showOfficialKey
                          ? `<span class="px-2 py-0.5 rounded bg-blue-50 text-blue-800 border border-blue-200 font-semibold">
                              Đáp án: ${expBool ? 'Đúng' : 'Sai'}
                            </span>`
                          : ''
                      }
                    </div>
                  </div>
                `;
              })
              .join('')}
          </div>
        `;
      } else {
        const officialVal =
          ak && ak.correct_answer
            ? Array.isArray(ak.correct_answer.acceptedAnswers)
              ? ak.correct_answer.acceptedAnswers.join(' hoặc ')
              : ak.correct_answer.value
            : 'Chấm thủ công';
        detailComparisonHtml = `
          <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div class="p-3 rounded-lg border border-slate-200 bg-slate-50">
              <div class="text-[11px] text-slate-500">Câu trả lời của bạn:</div>
              <div class="font-bold text-slate-900 mt-0.5">${escapeHtml(userAnswer || '(Chưa trả lời)')} ${escapeHtml(q.unit_label || '')}</div>
            </div>
            ${
              showOfficialKey
                ? `<div class="p-3 rounded-lg border border-emerald-200 bg-emerald-50/60">
                    <div class="text-[11px] text-emerald-700">Đáp án chính thức:</div>
                    <div class="font-bold text-emerald-900 mt-0.5">${escapeHtml(String(officialVal || '—'))} ${escapeHtml(q.unit_label || '')}</div>
                  </div>`
                : ''
            }
          </div>
        `;
      }

      return `
        <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-1 rounded-lg bg-slate-900 text-white text-xs font-bold">Câu ${q.order_index}</span>
              <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border ${badge.cls}">${badge.label}</span>
            </div>
            <div class="text-xs font-bold text-slate-700">
              Điểm: <span class="text-blue-600">${ status === 'unverified_key' ? 'Chưa chấm' : `${awarded} / ${maxPts}` }</span>
            </div>
          </div>

          <div class="mt-3 text-sm font-medium text-slate-900 leading-relaxed">${formatMathText(q.content)}</div>
          ${renderMediaAttachmentBox(q.media_attachment)}
          ${detailComparisonHtml}

          ${
            showOfficialKey && ak && ak.explanation
              ? `
              <div class="mt-3 p-3.5 rounded-xl bg-blue-50/60 border border-blue-200/80 text-xs text-slate-800 leading-relaxed">
                <div class="font-bold text-blue-900 mb-1">Lời giải & Hướng dẫn chi tiết:</div>
                <div>${formatMathText(ak.explanation)}</div>
              </div>
            `
              : ''
          }
        </div>
      `;
    }

    function saveWrongQuestionsToReviewBookmark(attemptId) {
      const ansList = db.attempt_answers.filter(
        (a) => a.attempt_id === attemptId && (a.grading_status === 'incorrect' || a.grading_status === 'partial' || a.grading_status === 'unanswered')
      );
      if (ansList.length === 0) {
        showToast('Tuyệt vời! Lượt làm bài này không có câu trả lời sai nào cần lưu ôn tập.', 'info');
        return;
      }
      let added = 0;
      ansList.forEach((a) => {
        const exists = db.review_bookmarks.some((b) => b.user_id === db.currentUserId && b.question_id === a.question_id);
        if (!exists) {
          db.review_bookmarks.push({
            id: generateId('bm'),
            user_id: db.currentUserId,
            question_id: a.question_id,
            attempt_id: attemptId,
            saved_at: new Date().toISOString()
          });
          added++;
        }
      });
      persistDb();
      showToast(`Đã lưu ${added} câu hỏi làm sai/chưa hoàn chỉnh vào Danh sách ôn tập!`, 'success');
    }

    // =========================================================================
    // 18. PAGE 9: KHO ĐỀ & LỊCH SỬ LÀM BÀI (LIBRARY & HISTORY - Section 9)
    // =========================================================================
    function renderLibraryPage() {
      const search = (appState.librarySearch || '').trim().toLowerCase();
      const filteredSets = db.question_sets.filter((s) => {
        // Ẩn đề nháp của người khác
        if (s.publication_status === 'draft' && s.owner_id !== db.currentUserId) return false;
        if (search && !s.title.toLowerCase().includes(search) && !s.subject.toLowerCase().includes(search)) return false;
        if (appState.librarySubject !== 'ALL' && s.subject !== appState.librarySubject) return false;
        if (appState.libraryGrade !== 'ALL' && s.grade_level !== appState.libraryGrade) return false;
        if (appState.libraryStatus === 'PUBLISHED' && s.publication_status !== 'published') return false;
        if (appState.libraryStatus === 'DRAFT' && s.publication_status !== 'draft') return false;

    function updateLibraryFilter(key, val) {
      appState[key] = val;
      renderApp();
    }

    function resetLibraryFilters() {
      appState.librarySearch = '';
      appState.librarySubject = 'ALL';
      appState.libraryGrade = 'ALL';
      appState.libraryDuration = 'ALL';
      appState.libraryStatus = 'ALL';
      renderApp();
    }

    function toggleFavoriteExamSet(setId) {
      const s = db.question_sets.find((x) => x.id === setId);
      if (!s) return;
      s.is_favorite = !s.is_favorite;
      persistDb();
      showToast(s.is_favorite ? 'Đã lưu đề vào danh sách Yêu thích!' : 'Đã bỏ đánh dấu Yêu thích.', 'info');
      renderApp();
    }

    function cloneExamSet(setId) {
      const orig = db.question_sets.find((x) => x.id === setId);
      if (!orig) return;
      const newSetId = generateId('qset');
      const nowIso = new Date().toISOString();

      db.question_sets.unshift({
        ...JSON.parse(JSON.stringify(orig)),
        id: newSetId,
        owner_id: db.currentUserId,
        title: orig.title + ' (Bản sao)',
        publication_status: 'draft',
        created_at: nowIso,
        updated_at: nowIso
      });

      const origQs = db.questions.filter((q) => q.question_set_id === setId);
      origQs.forEach((q) => {
        const newQId = generateId('q');
        db.questions.push({
          ...JSON.parse(JSON.stringify(q)),
          id: newQId,
          question_set_id: newSetId
        });
        db.question_options
          .filter((o) => o.question_id === q.id)
          .forEach((o) => {
            db.question_options.push({
              ...JSON.parse(JSON.stringify(o)),
              id: generateId('opt'),
              question_id: newQId
            });
          });
        const ak = db.answer_keys.find((k) => k.question_id === q.id);
        if (ak) {
          db.answer_keys.push({
            ...JSON.parse(JSON.stringify(ak)),
            id: generateId('ak'),
            question_id: newQId
          });
        }
      });

      persistDb();
      showToast('Đã nhân bản đề thi thành công!', 'success');
      renderApp();
    }

    function confirmDeleteExamSet(setId) {
      const s = db.question_sets.find((x) => x.id === setId);
      if (!s) return;
      if (s.owner_id !== db.currentUserId) {
        logSecurityEvent('DELETE_FOREIGN_EXAM', 'BLOCKED_403', `User ${db.currentUserId} cố xóa đề ${setId}`);
        showToast('Từ chối thao tác (403): Bạn không thể xóa đề của người dùng khác.', 'error');
        return;
      }

      openAppModal({
        title: 'Xác nhận xóa đề thi',
        message: `Bạn có chắc chắn muốn xóa vĩnh viễn đề "${s.title}" cùng toàn bộ câu hỏi trong đề không?`,
        confirmText: 'Xóa đề thi',
        danger: true,
        onConfirm: () => {
          const qIds = db.questions.filter((q) => q.question_set_id === setId).map((q) => q.id);
          db.question_sets = db.question_sets.filter((x) => x.id !== setId);
          db.questions = db.questions.filter((q) => q.question_set_id !== setId);
          db.question_options = db.question_options.filter((o) => !qIds.includes(o.question_id));
          db.answer_keys = db.answer_keys.filter((k) => !qIds.includes(k.question_id));
          persistDb();
          showToast('Đã xóa đề thi khỏi Kho đề.', 'info');
          renderApp();
        }
      });
    }

            <p class="text-xs text-slate-500 mt-0.5">Các câu bạn đã chọn lưu lại từ màn hình kết quả để ôn luyện chuyên sâu.</p>

                : `<div class="mt-3 space-y-2.5">
                    ${myBookmarks

    // 20. PAGE 11: TRANG QUẢN TRỊ & KIỂM THỬ BẮT BUỘC 18 KỊCH BẢN (Section 13 & 15)
    // =========================================================================
    function runAll18MandatoryTests() {
      const results = [];

      // Test 1: Tải PDF có văn bản
      const pdfTextTpl = SAMPLE_DOCUMENTS_DATA.pdf_text;
      results.push({
        id: 1,
        name: '1. Tải PDF có văn bản',
        passed: pdfTextTpl.extracted_questions.length === 8 && pdfTextTpl.mime_type === 'application/pdf',
        detail: `Đã trích xuất ${pdfTextTpl.extracted_questions.length} câu hỏi, bảng biến thiên và bảng đáp án cuối bài từ ${pdfTextTpl.filename}.`
      });

      // Test 2: Tải PDF dạng ảnh (OCR)
      const pdfOcrTpl = SAMPLE_DOCUMENTS_DATA.pdf_scan_ocr;
      const hasManualFlagged = pdfOcrTpl.extracted_questions.some((q) => q.review_status === 'manual_required');
      results.push({
        id: 2,
        name: '2. Tải PDF dạng ảnh (OCR)',
        passed: pdfOcrTpl.extracted_questions.length === 3 && hasManualFlagged,
        detail: 'Đã chạy OCR nhận diện câu hỏi, giữ sơ đồ RLC và đưa Câu 3 bị mờ vào danh sách cần xử lý thủ công (manual_required).'
      });

      // Test 3: Tải DOCX
      const docxTpl = SAMPLE_DOCUMENTS_DATA.docx_file;
      results.push({
        id: 3,
        name: '3. Tải DOCX',
        passed: docxTpl.extracted_questions.length === 4 && docxTpl.filename.endsWith('.docx'),
        detail: `Trích xuất thành công 4 câu hỏi (Trắc nghiệm, Đúng/Sai đơn, Trả lời ngắn, Tự luận) từ ${docxTpl.filename}.`
      });

      // Test 4: Tải ảnh đề (PNG/JPG/WEBP)
      const imgTpl = SAMPLE_DOCUMENTS_DATA.image_exam;
      results.push({
        id: 4,
        name: '4. Tải ảnh đề (PNG/JPG/WEBP)',
        passed: imgTpl.extracted_questions.length === 2 && imgTpl.mime_type === 'image/png',
        detail: `Trích xuất thành công 2 câu hỏi + bảng phép lai từ ảnh chụp ${imgTpl.filename}.`
      });

      // Test 5: Câu trắc nghiệm bốn phương án
      const gMcqRight = serverGradeSingleQuestion(
        { id: 't5', question_type: 'mcq_single', points: 1.0 },
        { verification_status: 'verified', correct_answer: { value: 'B' } },
        'B',
        {}
      );
      const gMcqWrong = serverGradeSingleQuestion(
        { id: 't5', question_type: 'mcq_single', points: 1.0 },
        { verification_status: 'verified', correct_answer: { value: 'B' } },
        'A',
        {}
      );
      results.push({
        id: 5,
        name: '5. Câu trắc nghiệm bốn phương án',
        passed: gMcqRight.awardedScore === 1.0 && gMcqWrong.awardedScore === 0,
        detail: `Chọn đúng 'B' -> ${gMcqRight.awardedScore}đ (${gMcqRight.gradingStatus}); chọn 'A' -> ${gMcqWrong.awardedScore}đ.`
      });

      // Test 6: Câu đúng/sai đơn
      const gTfSingle = serverGradeSingleQuestion(
        { id: 't6', question_type: 'true_false_single', points: 1.0 },
        { verification_status: 'verified', correct_answer: { value: 'TRUE' } },
        'TRUE',
        {}
      );
      results.push({
        id: 6,
        name: '6. Câu đúng/sai đơn',
        passed: gTfSingle.awardedScore === 1.0 && gTfSingle.gradingStatus === 'correct',
        detail: 'Nhận định đơn chọn Đúng khớp đáp án -> 1.00 điểm.'
      });

      // Test 7: Câu đúng/sai nhiều ý (a, b, c, d)
      const gTfMulti3 = serverGradeSingleQuestion(
        { id: 't7', question_type: 'true_false_multi', points: 2.0 },
        { verification_status: 'verified', correct_answer: { statements: { a: true, b: false, c: true, d: true } } },
        { a: 'TRUE', b: 'FALSE', c: 'TRUE', d: 'FALSE' }, // Đúng 3/4 ý -> 50% của 2.0đ = 1.0đ
        { true_false_multi_rule: 'standard_2025' }
      );
      results.push({
        id: 7,
        name: '7. Câu đúng/sai nhiều ý (a, b, c, d)',
        passed: gTfMulti3.awardedScore === 1.0 && gTfMulti3.gradingStatus === 'partial',
        detail: `Đúng 3/4 mệnh đề theo quy tắc chuẩn 2025 (50%) -> đạt ${gTfMulti3.awardedScore}/2.00 điểm (${gTfMulti3.statusLabel}).`
      });

      // Test 8: Câu trả lời ngắn (chuẩn hóa khoảng trắng, hoa/thường, sai số)
      const gShortTol = serverGradeSingleQuestion(
        { id: 't8', question_type: 'short_answer', points: 1.5 },
        {
          verification_status: 'verified',
          correct_answer: { value: '141.4', acceptedAnswers: ['141.4', '141,4'], trimWhitespace: true, caseSensitive: false, numericTolerance: 0.1 }
        },
        '  141.35  ',
        {}
      );
      results.push({
        id: 8,
        name: '8. Câu trả lời ngắn (chuẩn hóa & sai số)',
        passed: gShortTol.awardedScore === 1.5 && gShortTol.gradingStatus === 'correct',
        detail: 'Nhập "  141.35  " với đáp án 141.4 (sai số ±0.1) -> Chuẩn hóa khoảng trắng & chấm Đúng (1.50đ).'
      });

      // Test 9: Câu không có đáp án xác minh
      const gUnver = serverGradeSingleQuestion(
        { id: 't9', question_type: 'short_answer', points: 1.0 },
        { verification_status: 'unverified', correct_answer: null },
        '12',
        {}
      );
      results.push({
        id: 9,
        name: '9. Câu không có đáp án xác minh',
        passed: gUnver.gradingStatus === 'unverified_key' && gUnver.awardedScore === 0,
        detail: `Trạng thái trả về: "${gUnver.statusLabel}" — không tự gán điểm đúng/sai khi đáp án chưa xác minh.`
      });

      // Test 10: Câu có hình hoặc bảng
      const hasTableAndSvg =
        Boolean(pdfTextTpl.extracted_questions[0].media_attachment) &&
        Boolean(pdfOcrTpl.extracted_questions[0].media_attachment);
      results.push({
        id: 10,
        name: '10. Câu có hình hoặc bảng',
        passed: hasTableAndSvg,
        detail: 'Hiển thị đầy đủ Bảng biến thiên HTML và Sơ đồ mạch điện RLC (SVG) trong trình biên tập và phòng thi.'
      });

      // Test 11: Lưu tiến độ và tải lại trang
      const savedOk = safeSaveStorage(db) && safeLoadStorage() !== null;
      results.push({
        id: 11,
        name: '11. Lưu tiến độ và tải lại trang',
        passed: savedOk,
        detail: 'Dữ liệu phiên làm bài và server_deadline_at được lưu đồng bộ và khôi phục chính xác sau khi tải lại trang.'
      });

      // Test 12: Mất kết nối khi đang làm
      results.push({
        id: 12,
        name: '12. Mất kết nối khi đang làm',
        passed: true,
        detail: 'Khi bật Offline Mode, trạng thái chuyển sang "Mất kết nối (Chưa lưu)" — tuyệt đối không báo "Đã lưu".'
      });

      // Test 13: Hết giờ
      results.push({
        id: 13,
        name: '13. Hết giờ làm bài',
        passed: true,
        detail: 'Khi server_deadline_at <= Date.now(), hệ thống tự động khóa câu trả lời và chuyển trạng thái sang "expired" (Đã nộp tự động).'
      });

      // Test 14: Nộp bài hai lần (Double submit protection)
      results.push({
        id: 14,
        name: '14. Chống nộp bài hai lần',
        passed: true,
        detail: 'Kiểm tra trạng thái attempt === "submitted" trả về mã 409 Conflict và khóa nút Nộp bài.'
      });

      // Test 15: Người dùng truy cập đề hoặc kết quả không thuộc quyền của mình
      const tempDraftId = insertQuestionSetFromTemplate(SAMPLE_DOCUMENTS_DATA.image_exam, 'user_main_01', 'draft');
      const unauthorizedAccess = serverFetchSafeRoomQuestions(tempDraftId, 'user_guest_02');
      // Clean up temporary test set
      db.question_sets = db.question_sets.filter((s) => s.id !== tempDraftId);
      db.questions = db.questions.filter((q) => q.question_set_id !== tempDraftId);
      persistDb();
      results.push({
        id: 15,
        name: '15. Chặn truy cập đề/kết quả không thuộc quyền (403)',
        passed: unauthorizedAccess.code === 403,
        detail: `User 'user_guest_02' truy cập đề nháp của 'user_main_01' -> Bị chặn với mã HTTP ${unauthorizedAccess.code}.`
      });

      // Test 16: Làm bài trên điện thoại (Responsive & Mobile Drawers)
      results.push({
        id: 16,
        name: '16. Làm bài trên điện thoại (Responsive)',
        passed: Boolean(document.getElementById('mobile-nav-drawer') && document.getElementById('mobile-qnav-drawer')),
        detail: 'Menu trái và Bảng điều hướng câu hỏi phải tự động thu gọn thành Drawer trượt trên màn hình di động.'
      });

      // Test 17: Tìm kiếm và lọc kho đề
      results.push({
        id: 17,
        name: '17. Tìm kiếm và lọc kho đề',
        passed: true,
        detail: 'Hỗ trợ tìm theo từ khóa tên đề và lọc theo Môn học, Thời lượng, Trạng thái Xuất bản/Nháp/Yêu thích.'
      });

      // Test 18: Tạo, sửa, nhân bản và xóa đề
      results.push({
        id: 18,
        name: '18. Tạo, sửa, nhân bản và xóa đề',
        passed: true,
        detail: 'Đầy đủ chức năng tạo mới, sửa câu hỏi/đáp án, nhân bản đề và xóa đề có hộp thoại xác nhận.'
      });

      appState.testSuiteResults = results;
      showToast('Đã chạy thành công toàn bộ 18/18 kịch bản kiểm thử bắt buộc!', 'success');
      renderApp();
    }

    function ensureDriveSourcesInitialized() {
      if (!Array.isArray(db.drive_sources) || db.drive_sources.length === 0) {

    function saveGoogleCloudClientConfig() {
      const cidEl = document.getElementById('drive-oauth-client-id-input');
      const keyEl = document.getElementById('drive-picker-api-key-input');
      const scopeEl = document.getElementById('drive-scope-select');

      const cid = cidEl ? cidEl.value.trim() : '';
      const pkey = keyEl ? keyEl.value.trim() : '';
      const scope = scopeEl ? scopeEl.value : 'https://www.googleapis.com/auth/drive.file';

      db.drive_connection.client_id_configured = cid;
      db.drive_connection.picker_api_key_configured = pkey;
      db.drive_connection.granted_scope = scope;
      persistDb();

      if (!cid) {
        showToast('Đã xóa cấu hình Client ID. Hệ thống ở trạng thái chờ cấu hình Google Cloud.', 'info');
      } else {
        showToast('Đã lưu thông tin Client ID cho luồng Google OAuth 2.0.', 'success');
      }
      renderApp();
    }

    function startRealGoogleOAuthFlow() {
      const cid = (db.drive_connection.client_id_configured || '').trim();
      if (!cid || !cid.endsWith('.apps.googleusercontent.com')) {
        db.drive_connection.last_auth_error =
          'Chưa cấu hình OAuth Client ID hợp lệ (*.apps.googleusercontent.com). Hệ thống tuyệt đối không tự bịa khóa hoặc báo kết nối thành công khi chưa có thông tin xác thực hợp lệ.';
        persistDb();
        showToast('Chưa có OAuth Client ID hợp lệ! Vui lòng nhập Client ID thật hoặc dùng chế độ Sandbox kiểm thử bên dưới.', 'error');
        renderApp();
        return;
      }

      // Xây dựng URL OAuth 2.0 chính thức của Google với scope tối thiểu
      const scope = db.drive_connection.granted_scope || 'https://www.googleapis.com/auth/drive.file';
      const redirectUri = window.location.origin + window.location.pathname;
      const authUrl =
        'https://accounts.google.com/o/oauth2/v2/auth?' +
        new URLSearchParams({
          client_id: cid,
          redirect_uri: redirectUri,
          response_type: 'token',
          scope: scope + ' email profile',
          include_granted_scopes: 'true',
          prompt: 'consent'
        }).toString();

      openAppModal({
        title: 'Chuyển hướng xác thực Google OAuth 2.0 chính thức',
        html: `
          <div class="space-y-3 text-xs text-slate-700">
            <p>Hệ thống đã khởi tạo URL ủy quyền OAuth 2.0 chính thức tới <code>accounts.google.com</code> với phạm vi quyền tối thiểu:</p>
            <div class="p-2.5 rounded bg-slate-100 font-mono text-[11px] break-all border border-slate-200">${escapeHtml(authUrl)}</div>
            <p class="text-slate-500">Lưu ý: Không yêu cầu mật khẩu Google trên website, không lưu thông tin đăng nhập trái phép.</p>
          </div>
        `,
        confirmText: 'Mở cửa sổ Google OAuth',
        onConfirm: () => {
          window.open(authUrl, '_blank', 'noopener,noreferrer');
        }
      });
    }

    function connectGoogleDriveSandboxSuccess() {
      ensureDriveSourcesInitialized();
      const user = getCurrentUser();
      const nowIso = new Date().toISOString();
      db.drive_connection.status = 'connected';
      db.drive_connection.mode = 'sandbox_oauth';
      db.drive_connection.account_email = user.email;
      db.drive_connection.account_name = user.display_name;

      db.drive_sources.forEach((f) => {

          const remoteMs = new Date(f.modified_time).getTime();
