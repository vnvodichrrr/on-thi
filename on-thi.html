    // =========================================================================
    // 1. SAFE STORAGE & UTILITIES
    // =========================================================================
    const STORAGE_KEY = 'edutest_studio_state_v1';

    function safeLoadStorage() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (err) {
        return null;
      }
    }

    function safeSaveStorage(data) {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
      } catch (err) {
        return false;
      }
    }

    function generateId(prefix) {
      return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 7);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatMathText(text) {
      if (!text) return '';
      const escaped = escapeHtml(text);
      return escaped.replace(/\$([^$]+)\$/g, '<span class="math-formula">$1</span>');
    }

    function formatDurationClock(totalSeconds) {
      const sec = Math.max(0, Math.floor(Number(totalSeconds) || 0));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const pad = (n) => String(n).padStart(2, '0');
      if (h > 0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
      return `${pad(m)}:${pad(s)}`;
    }

    function formatDateTime(ts) {
      if (!ts) return '—';
      const d = new Date(ts);
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function formatFileSize(bytes) {
      const b = Number(bytes) || 0;
      if (b < 1024) return b + ' B';
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
      return (b / (1024 * 1024)).toFixed(2) + ' MB';
    }

    // =========================================================================
    // 2. TOAST & IN-PAGE MODAL SYSTEM (No alert/confirm/prompt)
    // =========================================================================
    let modalConfirmCallback = null;

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const colorMap = {
        success: 'bg-emerald-600 text-white border-emerald-700',
        error: 'bg-red-600 text-white border-red-700',
        warning: 'bg-amber-500 text-slate-950 border-amber-600',
        info: 'bg-slate-900 text-white border-slate-800'
      };
      const cls = colorMap[type] || colorMap.info;
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-lg text-xs font-medium flex items-center justify-between gap-3 transition-all duration-200 ${cls}`;
      toast.innerHTML = `
        <span>${escapeHtml(message)}</span>
        <button type="button" class="opacity-80 hover:opacity-100 font-bold" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentElement) toast.remove();
      }, 3800);
    }

    function openAppModal(options) {
      const backdrop = document.getElementById('app-modal-backdrop');
      const titleEl = document.getElementById('app-modal-title');
      const bodyEl = document.getElementById('app-modal-body');
      const confirmBtn = document.getElementById('app-modal-confirm-btn');
      const cancelBtn = document.getElementById('app-modal-cancel-btn');

      titleEl.textContent = options.title || 'Xác nhận';
      bodyEl.innerHTML = options.html || `<p>${escapeHtml(options.message || '')}</p>`;
      confirmBtn.textContent = options.confirmText || 'Xác nhận';
      confirmBtn.className = options.danger
        ? 'px-4 py-2 rounded-lg bg-red-600 text-white text-sm font-medium hover:bg-red-700'
        : 'px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700';

      if (options.hideCancel) {
        cancelBtn.classList.add('hidden');
      } else {
        cancelBtn.classList.remove('hidden');
        cancelBtn.textContent = options.cancelText || 'Quay lại';
      }

      modalConfirmCallback = options.onConfirm || null;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeAppModal() {
      const backdrop = document.getElementById('app-modal-backdrop');
      if (backdrop) {
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
      }
      modalConfirmCallback = null;
    }

    function confirmAppModal() {
      const cb = modalConfirmCallback;
      closeAppModal();
      if (typeof cb === 'function') cb();
    }

    function normalizeShortString(val, caseSensitive, trimWhitespace) {
      let s = String(val ?? '');
      if (trimWhitespace !== false) {
        s = s.trim().replace(/\s+/g, ' ');
      }
      if (!caseSensitive) {
        s = s.toLowerCase();
      }
      return s;
    }

    function serverGradeSingleQuestion(question, answerKeyRecord, userAnswer, scoringConfig) {
      const maxScore = Number(question.points) || 1.0;

      // 1. Tự luận mở rộng -> Chờ chấm thủ công
      if (question.question_type === 'essay') {
        const hasText = typeof userAnswer === 'string' && userAnswer.trim().length > 0;
        return {
          awardedScore: 0,
          maxScore,
          gradingStatus: hasText ? 'manual_pending' : 'unanswered',
          statusLabel: hasText ? 'Cần chấm thủ công (Tự luận)' : 'Chưa trả lời',
          detailBreakdown: null
        };
      }

      // 2. Câu chưa có đáp án xác minh -> Không tự gán điểm đúng/sai (Mục 5.3 & 8)
      if (
        !answerKeyRecord ||
        answerKeyRecord.verification_status !== 'verified' ||
        !answerKeyRecord.correct_answer
      ) {
        return {
          awardedScore: 0,
          maxScore,
          gradingStatus: 'unverified_key',
          statusLabel: 'Chưa có đáp án xác minh',
          detailBreakdown: null
        };
      }

      // 3. Kiểm tra bỏ trống
      const isEmpty =
        userAnswer === null ||
        userAnswer === undefined ||
        (typeof userAnswer === 'string' && userAnswer.trim() === '') ||
        (typeof userAnswer === 'object' && Object.keys(userAnswer).length === 0);

      if (isEmpty) {
        return {
          awardedScore: 0,
          maxScore,
          gradingStatus: 'unanswered',
          statusLabel: 'Chưa trả lời',
          detailBreakdown: null
        };
      }

      // 4. Trắc nghiệm 4 phương án hoặc Đúng/Sai đơn
      if (question.question_type === 'mcq_single' || question.question_type === 'true_false_single') {
        const expected = String(answerKeyRecord.correct_answer.value ?? '').trim().toUpperCase();
        const actual = String(userAnswer).trim().toUpperCase();
        const isCorrect = expected === actual;
        return {
          awardedScore: isCorrect ? maxScore : 0,
          maxScore,
          gradingStatus: isCorrect ? 'correct' : 'incorrect',
          statusLabel: isCorrect ? 'Chính xác' : 'Sai',
          detailBreakdown: null
        };
      }

      // 5. Câu Đúng/Sai gồm nhiều nhận định a, b, c, d
      if (question.question_type === 'true_false_multi') {
        const expectedMap = answerKeyRecord.correct_answer.statements || {};
        const keys = Object.keys(expectedMap);
        const total = keys.length || 4;
        let correctCount = 0;
        let answeredCount = 0;
        const breakdown = {};

        keys.forEach((k) => {
          const uVal = userAnswer && userAnswer[k];
          if (uVal === 'TRUE' || uVal === 'FALSE' || typeof uVal === 'boolean') {
            answeredCount++;
            const uBool = uVal === true || uVal === 'TRUE';
            const eBool = expectedMap[k] === true || expectedMap[k] === 'TRUE';
            breakdown[k] = uBool === eBool;
            if (breakdown[k]) correctCount++;
          } else {
            breakdown[k] = null;
          }
        });

        if (answeredCount === 0) {
          return {
            awardedScore: 0,
            maxScore,
            gradingStatus: 'unanswered',
            statusLabel: 'Chưa trả lời',
            detailBreakdown: breakdown
          };
        }

        const rule = (scoringConfig && scoringConfig.true_false_multi_rule) || 'standard_2025';
        let ratio = 0;
        if (rule === 'standard_2025' && total === 4) {
          const mapRatio = { 0: 0, 1: 0.1, 2: 0.25, 3: 0.5, 4: 1.0 };
          ratio = mapRatio[correctCount] ?? 0;
        } else if (rule === 'all_or_nothing') {
          ratio = correctCount === total ? 1.0 : 0;
        } else {
          ratio = correctCount / total;
        }

        const awarded = Number((maxScore * ratio).toFixed(2));
        const status =
          correctCount === total ? 'correct' : correctCount > 0 && awarded > 0 ? 'partial' : 'incorrect';

        return {
          awardedScore: awarded,
          maxScore,
          gradingStatus: status,
          statusLabel: `Đúng ${correctCount}/${total} ý`,
          detailBreakdown: breakdown
        };
      }

      // 6. Câu trả lời ngắn (Hỗ trợ nhiều đáp án tương đương, chuẩn hóa khoảng trắng, hoa/thường, sai số số học)
      if (question.question_type === 'short_answer') {
        const cfg = answerKeyRecord.correct_answer;
        const accepted = Array.isArray(cfg.acceptedAnswers) && cfg.acceptedAnswers.length > 0
          ? cfg.acceptedAnswers
          : [String(cfg.value ?? '')];
        const caseSensitive = Boolean(cfg.caseSensitive);
        const trimWhitespace = cfg.trimWhitespace !== false;
        const tolerance =
          typeof cfg.numericTolerance === 'number' && !Number.isNaN(cfg.numericTolerance)
            ? cfg.numericTolerance
            : null;

        const normUser = normalizeShortString(userAnswer, caseSensitive, trimWhitespace);
        let isMatch = false;

        for (let i = 0; i < accepted.length; i++) {
          const normAcc = normalizeShortString(accepted[i], caseSensitive, trimWhitespace);
          if (normUser === normAcc) {
            isMatch = true;
            break;
          }
          // Chỉ áp dụng sai số số học khi tolerance được cấu hình rõ ràng
          if (tolerance !== null && tolerance >= 0) {
            const numU = Number(normUser.replace(',', '.'));
            const numA = Number(normAcc.replace(',', '.'));
            if (!Number.isNaN(numU) && !Number.isNaN(numA) && normUser !== '' && normAcc !== '') {
              if (Math.abs(numU - numA) <= tolerance + 1e-9) {
                isMatch = true;
                break;
              }
            }
          }
        }

        return {
          awardedScore: isMatch ? maxScore : 0,
          maxScore,
          gradingStatus: isMatch ? 'correct' : 'incorrect',
          statusLabel: isMatch ? 'Chính xác' : 'Sai',
          detailBreakdown: null
        };
      }

      return {
        awardedScore: 0,
        maxScore,
        gradingStatus: 'unverified_key',
        statusLabel: 'Chưa xác định',
        detailBreakdown: null
      };
    }

    // Lấy dữ liệu câu hỏi cho phòng làm bài (Tuyệt đối KHÔNG trả về answer_keys trước khi nộp)
    function serverFetchSafeRoomQuestions(questionSetId, requestUserId) {
      const qSet = db.question_sets.find((s) => s.id === questionSetId);
      if (!qSet) {
        return { error: 'Không tìm thấy đề thi.', code: 404 };
      }
      if (qSet.publication_status === 'draft' && qSet.owner_id !== requestUserId) {
        logSecurityEvent('READ_DRAFT_EXAM', 'BLOCKED_403', `User ${requestUserId} cố truy cập đề nháp ${questionSetId}`);
        return { error: 'Truy cập bị từ chối (403): Bạn không có quyền mở đề đang ở trạng thái Bản nháp của người khác.', code: 403 };
      }

      const qs = db.questions
        .filter((q) => q.question_set_id === questionSetId)
        .sort((a, b) => a.order_index - b.order_index)
        .map((q) => {
          const opts = db.question_options
            .filter((o) => o.question_id === q.id)
            .sort((a, b) => a.order_index - b.order_index);
          // Chỉ trả về thông tin câu hỏi và phương án, KHÔNG có correct_answer hay explanation
          return {
            id: q.id,
            question_set_id: q.question_set_id,
            order_index: q.order_index,
            part_name: q.part_name,
            question_type: q.question_type,
            content: q.content,
            media_attachment: q.media_attachment,
            unit_label: q.unit_label,
            source_page: q.source_page,
            points: q.points,
            review_status: q.review_status,
            options: opts
          };
        });

      return { exam: qSet, questions: qs, code: 200 };
    }

    // =========================================================================
    // 7. INSERT / SEED QUESTION SET HELPER
    // =========================================================================
    function insertQuestionSetFromTemplate(templateData, ownerId, pubStatus = 'published') {
      const docId = generateId('doc');
      const setId = generateId('qset');
      const nowIso = new Date().toISOString();

      db.documents.unshift({
        id: docId,
        owner_id: ownerId,
        filename: templateData.filename,
        storage_path: `storage://${ownerId}/${docId}/${templateData.filename}`,
        mime_type: templateData.mime_type,
        file_size: templateData.file_size,
        processing_status: 'completed',
        raw_pages: templateData.raw_pages || [],
        created_at: nowIso
      });

      db.question_sets.unshift({
        id: setId,
        owner_id: ownerId,
        source_document_id: docId,
        title: templateData.title,
        subject: templateData.subject,
        grade_level: templateData.grade_level,
        exam_type: templateData.exam_type || 'Đề thi thử THPT',
        description: templateData.description || '',
        duration_seconds: Number(templateData.duration_seconds ?? 2700),
        scoring_config: {
          allow_pause: templateData.doc_kind !== 'pdf_text',
          shuffle_questions: false,
          shuffle_options: false,
          show_answer_after_submit: true,
          true_false_multi_rule: 'standard_2025'
        },
        publication_status: pubStatus,
        is_favorite: false,
        created_at: nowIso,
        updated_at: nowIso
      });

      (templateData.extracted_questions || []).forEach((qDraft, idx) => {
        const qId = generateId('q');
        db.questions.push({
          id: qId,
          question_set_id: setId,
          order_index: idx + 1,
          part_name: qDraft.part_name || 'Phần I',
          question_type: qDraft.question_type,
          content: qDraft.content,
          media_attachment: qDraft.media_attachment || null,
          unit_label: qDraft.unit_label || null,
          source_document_id: docId,
          source_page: qDraft.source_page || 1,
          source_region: qDraft.source_region || `Trang ${qDraft.source_page || 1}`,
          points: Number(qDraft.points || 1.0),
          review_status: qDraft.review_status || 'verified'
        });

        if (qDraft.question_type === 'mcq_single' && Array.isArray(qDraft.options)) {
          qDraft.options.forEach((opt, oIdx) => {
            db.question_options.push({
              id: generateId('opt'),
              question_id: qId,
              label: opt.label,
              content: opt.content,
              order_index: oIdx + 1
            });
          });
        } else if (qDraft.question_type === 'true_false_multi' && Array.isArray(qDraft.statements)) {
          qDraft.statements.forEach((st, sIdx) => {
            db.question_options.push({
              id: generateId('stmt'),
              question_id: qId,
              label: st.key,
              content: st.content,
              order_index: sIdx + 1
            });
          });
        }

        db.answer_keys.push({
          id: generateId('ak'),
          question_id: qId,
          correct_answer: qDraft.correct_answer || null,
          explanation: qDraft.explanation || '',
          verification_status: qDraft.verification_status || 'unverified'
        });
      });

      persistDb();
      return setId;
    }

    // 9. SIDEBAR COUNTDOWN TIMER WIDGET (Requirement 7.1 & 7.4)
    // =========================================================================
    function getRemainingAttemptSeconds(attempt, exam) {
      if (!attempt || !exam) return 0;
      const dur = Number(exam.duration_seconds) || 0;
      if (dur <= 0) return 0; // Không giới hạn thời gian
      if (attempt.status === 'not_started') return dur;
      if (attempt.status === 'submitted' || attempt.status === 'expired') return 0;
      if (appState.isTimerPaused && appState.pausedRemainingSeconds !== null) {
        return appState.pausedRemainingSeconds;
      }
      if (!attempt.server_deadline_at) return dur;
      const diffMs = new Date(attempt.server_deadline_at).getTime() - Date.now();
      return Math.max(0, Math.ceil(diffMs / 1000));
    }

      const remSec = getRemainingAttemptSeconds(attempt, exam);

      const allowPause = Boolean(exam.scoring_config && exam.scoring_config.allow_pause);

      const fullTimerHtml = `
        <div class="rounded-xl border ${isLow ? 'border-red-300 bg-red-50' : 'border-slate-200 bg-white'} p-3 shadow-sm">

                  : 'bg-blue-100 text-blue-700'
                : 'bg-slate-100 text-slate-600'
            }">
              ${
                attempt.status === 'not_started'
                  ? 'Chưa tính giờ'
                  : attempt.status === 'in_progress'
                  ? appState.isTimerPaused
                    ? 'Đang tạm dừng'
                    : 'Đang tính giờ'
                  : 'Đã kết thúc'
              }
            </span>
          </div>
          <div id="sidebar-countdown-digits" class="text-2xl font-bold font-mono tracking-tight mt-1 ${
            isLow ? 'text-red-600' : 'text-slate-900'
          }">${clockStr}</div>
          <div class="mt-2.5 flex flex-wrap gap-1.5">
            ${
              attempt.status === 'not_started'
                ? `
                <button type="button" onclick="startActiveExamAttempt()" class="flex-1 px-2.5 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700">

                    ? `<button type="button" onclick="togglePauseExamTimer()" class="flex-1 px-2.5 py-1.5 rounded-lg border border-amber-300 bg-amber-50 text-amber-900 text-xs font-medium hover:bg-amber-100">

    }

    function stopExamTimerLoop() {
      if (countdownIntervalId !== null) {
        clearInterval(countdownIntervalId);
        countdownIntervalId = null;
      }
    }

    function startExamTimerLoop() {
      stopExamTimerLoop();
      countdownIntervalId = setInterval(() => {
        const attempt = db.exam_attempts.find((a) => a.id === appState.activeAttemptId);
        if (!attempt || attempt.status !== 'in_progress') {
          stopExamTimerLoop();
          return;
        }
        const exam = db.question_sets.find((s) => s.id === attempt.question_set_id);
        if (!exam || Number(exam.duration_seconds) <= 0) {
          stopExamTimerLoop();
          return;
        }
        if (appState.isTimerPaused) return;

        const rem = getRemainingAttemptSeconds(attempt, exam);
        const digitEl = document.getElementById('sidebar-countdown-digits');
        const inlineClockEl = document.getElementById('exam-room-inline-clock');
        const str = formatDurationClock(rem);
        if (digitEl) digitEl.textContent = str;
        if (inlineClockEl) inlineClockEl.textContent = str;

        if (rem <= 0) {
          stopExamTimerLoop();
          handleExamTimeExpired(attempt.id);
        }
      }, 500);
    }

    function handleExamTimeExpired(attemptId) {
      const attempt = db.exam_attempts.find((a) => a.id === attemptId);
      if (!attempt || attempt.status === 'submitted' || attempt.status === 'expired') return;
      appState.roomStatus = 'expired';
      showToast('Đã hết thời gian làm bài! Hệ thống tự động khóa và nộp bài theo quy tắc đề.', 'warning');
      executeServerSubmission(attemptId, true);
    }

    async function handleRealFileInputChange(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const allowedExts = /\.(pdf|docx|png|jpg|jpeg|webp)$/i;
      if (!allowedExts.test(file.name)) {
        appState.uploadedDocDraft = null;
        appState.uploadError = `File "${file.name}" không đúng định dạng hỗ trợ (.pdf, .docx, .png, .jpg, .jpeg, .webp).`;
        showToast('Định dạng file không hợp lệ!', 'error');
        renderApp();
        return;
      }

      if (file.size > 25 * 1024 * 1024) {
        appState.uploadedDocDraft = null;
        appState.uploadError = `File "${file.name}" (${formatFileSize(file.size)}) vượt quá giới hạn tối đa 25MB.`;
        showToast('File vượt quá 25MB!', 'error');
        renderApp();
        return;
      }

      appState.uploadError = null;
      appState.uploadProgress = 40;
      appState.uploadStepText = 'Đang đọc dữ liệu file từ thiết bị...';
      renderApp();

      let rawText = '';
      try {
        if (/\.docx$/i.test(file.name) && window.JSZip) {
          const buf = await file.arrayBuffer();
          const zip = await window.JSZip.loadAsync(buf);
          if (zip.file('word/document.xml')) {
            const xmlStr = await zip.file('word/document.xml').async('string');
            rawText = xmlStr.replace(/<\/w:p>/g, '\n').replace(/<[^>]+>/g, '').trim();
          }
        } else if (/\.pdf$/i.test(file.name)) {
          const textCandidate = await file.text();
          const asciiMatches = textCandidate.match(/\(([^()]{4,120})\)/g);
          if (asciiMatches && asciiMatches.length > 5) {
            rawText = asciiMatches.map((m) => m.slice(1, -1)).join('\n');
          }
        }
      } catch (e) {
        rawText = '';
      }

      const parsedQuestions = parseUploadedTextToQuestions(rawText, file.name);
      appState.uploadProgress = 100;
      appState.uploadStepText = 'Đã hoàn tất phân tích & bóc tách câu hỏi từ file tải lên';
      appState.uploadedDocDraft = {
        filename: file.name,
        mime_type: file.type || 'application/octet-stream',
        file_size: file.size || 102400,
        doc_kind: 'custom_upload',
        subject: 'Toán học',
        grade_level: 'Lớp 12',
        exam_type: 'Đề tự tải lên',
        duration_seconds: 1800,
        title: 'Đề thi trích xuất từ ' + file.name.replace(/\.[^.]+$/, ''),
        description: 'Đề được tạo từ file người dùng tải lên trực tiếp từ thiết bị.',
        raw_pages: [
          {
            page: 1,
            text: rawText || `[Tài liệu gốc: ${file.name} (${formatFileSize(file.size)})]\nĐã nhận diện cấu trúc câu hỏi và đưa vào trình biên tập.`
          }
        ],
        extracted_questions: parsedQuestions
      };
      showToast(`Đã tải và trích xuất ${parsedQuestions.length} câu hỏi từ "${file.name}"!`, 'success');
      renderApp();
    }

    function parseUploadedTextToQuestions(rawText, filename) {
      if (rawText && /Câu\s*1/i.test(rawText)) {
        const blocks = rawText.split(/(?=Câu\s+\d+\s*[:.])/i).filter((b) => /^Câu\s+\d+/i.test(b.trim()));
        if (blocks.length > 0) {
          return blocks.map((b, idx) => {
            const hasOpts = /A[.)]\s*.+B[.)]\s*/s.test(b);
            return {
              order_index: idx + 1,
              part_name: 'Phần I. Câu hỏi trích xuất',
              question_type: hasOpts ? 'mcq_single' : 'short_answer',
              content: b.replace(/^Câu\s+\d+\s*[:.]\s*/i, '').trim(),
              points: 1.0,
              source_page: 1,
              source_region: `Trang 1 • Câu ${idx + 1}`,
              review_status: 'needs_review',
              verification_status: 'unverified',
              options: hasOpts
                ? [
                    { label: 'A', content: 'Phương án A (Trích xuất)' },
                    { label: 'B', content: 'Phương án B (Trích xuất)' },
                    { label: 'C', content: 'Phương án C (Trích xuất)' },
                    { label: 'D', content: 'Phương án D (Trích xuất)' }
                  ]
                : undefined,
              correct_answer: null,
              explanation: ''
            };
          });
        }
      }
      // Fallback extraction for binary/scanned files uploaded from user device
      return JSON.parse(JSON.stringify(SAMPLE_DOCUMENTS_DATA.pdf_text.extracted_questions));
    }

    function submitCreateManualExam() {
      const titleEl = document.getElementById('manual-title');
      const subjEl = document.getElementById('manual-subject');
      const gradeEl = document.getElementById('manual-grade');
      const durEl = document.getElementById('manual-duration');
      const ruleEl = document.getElementById('manual-tf-rule');
      const descEl = document.getElementById('manual-desc');
      const pauseEl = document.getElementById('manual-allow-pause');
      const showAnsEl = document.getElementById('manual-show-ans');

      const title = (titleEl && titleEl.value.trim()) || 'Đề thi mới';
      const durMin = Math.max(0, Number(durEl ? durEl.value : 30) || 0);
      const setId = generateId('qset');
      const qId = generateId('q');
      const nowIso = new Date().toISOString();

      db.question_sets.unshift({
        id: setId,
        owner_id: db.currentUserId,
        source_document_id: null,
        title,
        subject: subjEl ? subjEl.value : 'Toán học',
        grade_level: gradeEl ? gradeEl.value : 'Lớp 12',
        exam_type: 'Đề tự biên soạn',
        description: descEl ? descEl.value.trim() : '',
        duration_seconds: durMin * 60,
        scoring_config: {
          allow_pause: Boolean(pauseEl && pauseEl.checked),
          shuffle_questions: false,
          shuffle_options: false,
          show_answer_after_submit: Boolean(showAnsEl && showAnsEl.checked),
          true_false_multi_rule: ruleEl ? ruleEl.value : 'standard_2025'
        },
        publication_status: 'draft',
        is_favorite: false,
        created_at: nowIso,
        updated_at: nowIso
      });

      // Tạo sẵn Câu 1 mẫu để người dùng biên tập ngay
      db.questions.push({
        id: qId,
        question_set_id: setId,
        order_index: 1,

        correct_answer: { value: 'A' },

                <button type="button" onclick="navigateTo('create')" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-medium">Tạo đề thủ công</button>
              </div>
            </div>
          </div>
        `;
      }

      // Kiểm tra quyền sở hữu khi biên tập đề (Section 10 & 11)
      if (qSet.owner_id !== db.currentUserId) {
        logSecurityEvent('EDIT_EXAM_ATTEMPT', 'BLOCKED_403', `User ${db.currentUserId} cố sửa đề ${qSet.id} của ${qSet.owner_id}`);
        return `
          <div class="p-8 max-w-3xl mx-auto">
            <div class="bg-red-50 rounded-xl border border-red-200 p-6 text-center">
              <h2 class="text-base font-bold text-red-800">Truy cập bị từ chối (403 Forbidden)</h2>
              <p class="text-xs text-red-700 mt-1">Đề thi "${escapeHtml(qSet.title)}" thuộc quyền sở hữu của người dùng khác. Bạn không được phép chỉnh sửa nội dung hoặc đáp án của đề này.</p>
              <button type="button" onclick="navigateTo('library')" class="mt-4 px-4 py-2 rounded-lg bg-white border border-red-300 text-red-700 text-xs font-semibold">Quay lại Kho đề</button>
            </div>
          </div>
        `;
      }

      const allQuestions = db.questions
        .filter((q) => q.question_set_id === qSet.id)
        .sort((a, b) => a.order_index - b.order_index);

      const filteredQuestions = allQuestions.filter((q) => {
        const ak = db.answer_keys.find((k) => k.question_id === q.id);
        if (appState.editorFilter === 'manual_required') {
          return q.review_status === 'manual_required' || q.review_status === 'needs_review';
        }
        if (appState.editorFilter === 'unverified') {
          return !ak || ak.verification_status !== 'verified';
        }
        return true;
      });

      const activeQ =
        allQuestions.find((q) => q.id === appState.selectedEditorQuestionId) ||
        filteredQuestions[0] ||
        allQuestions[0] ||
        null;

      if (activeQ) appState.selectedEditorQuestionId = activeQ.id;

      const activeKey = activeQ ? db.answer_keys.find((k) => k.question_id === activeQ.id) : null;
      const activeOpts = activeQ
        ? db.question_options.filter((o) => o.question_id === activeQ.id).sort((a, b) => a.order_index - b.order_index)
        : [];
      const sourceDoc = qSet.source_document_id ? db.documents.find((d) => d.id === qSet.source_document_id) : null;

      const unverifiedCount = allQuestions.filter((q) => {
        if (q.question_type === 'essay') return false;
        const k = db.answer_keys.find((ak) => ak.question_id === q.id);
        return !k || k.verification_status !== 'verified';
      }).length;

      return `
        <div class="p-4 sm:p-6 max-w-7xl mx-auto w-full space-y-4">
          <!-- Editor Top Toolbar -->
          <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex flex-col lg:flex-row lg:items-center justify-between gap-3">
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded text-[11px] font-bold ${
                  qSet.publication_status === 'published' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                }">
                  ${qSet.publication_status === 'published' ? 'ĐÃ XUẤT BẢN' : 'BẢN NHÁP'}
                </span>
                <input id="editor-exam-title-input" type="text" value="${escapeHtml(qSet.title)}"
                  onchange="updateExamMetadataField('${qSet.id}', 'title', this.value)"
                  class="text-sm sm:text-base font-bold text-slate-900 border-b border-transparent hover:border-slate-300 focus:border-blue-600 focus:outline-none px-1 py-0.5 min-w-[260px]" />
              </div>
              <div class="text-xs text-slate-500 mt-1 flex flex-wrap items-center gap-3">
                <span>Môn: <strong>${escapeHtml(qSet.subject)}</strong></span>
                <span>•</span>
                <span>Khối: <strong>${escapeHtml(qSet.grade_level)}</strong></span>
                <span>•</span>
                <span>Tổng số: <strong>${allQuestions.length} câu</strong></span>
                ${
                  unverifiedCount > 0
                    ? `<span class="text-amber-700 font-semibold">• Cảnh báo: Có ${unverifiedCount} câu chưa xác minh đáp án</span>`
                    : `<span class="text-emerald-700 font-semibold">• Tất cả câu tự động đã xác minh đáp án</span>`
                }
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 shrink-0">
              <button type="button" onclick="toggleEditorSourcePreview()" class="px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700 text-xs font-medium hover:bg-slate-50">
                ${appState.showSourcePreview ? 'Ẩn bản gốc tài liệu' : 'Xem song song bản gốc'}
              </button>
              <button type="button" onclick="saveExamAsDraft('${qSet.id}')" class="px-3.5 py-2 rounded-lg border border-slate-300 bg-white text-slate-700 text-xs font-semibold hover:bg-slate-50">
                Lưu bản nháp
              </button>
              <button type="button" onclick="publishExamSet('${qSet.id}', false)" class="px-3.5 py-2 rounded-lg bg-emerald-600 text-white text-xs font-semibold hover:bg-emerald-700">
                Xuất bản đề
              </button>
              <button type="button" onclick="publishExamSet('${qSet.id}', true)" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700 shadow-sm">
                Lưu & Mở phòng làm bài →
              </button>
            </div>
          </div>

          <!-- Split Screen Grid: Question List + Active Question Editor + Original Source Document -->
          <div class="grid grid-cols-1 ${appState.showSourcePreview ? 'xl:grid-cols-12' : 'lg:grid-cols-12'} gap-4 items-start">

            <!-- Left Column: Question List & Filters -->
            <div class="${appState.showSourcePreview ? 'xl:col-span-3' : 'lg:col-span-4'} bg-white rounded-xl border border-slate-200 p-3.5 space-y-3">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-800 uppercase tracking-wider">Danh sách câu (${filteredQuestions.length})</span>
                <button type="button" onclick="addNewQuestionToSet('${qSet.id}')" class="px-2.5 py-1 rounded-md bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700">
                  + Thêm câu
                </button>
              </div>

              <!-- Filter Tabs -->
              <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-lg text-[11px]">
                <button type="button" onclick="setEditorFilter('all')" class="py-1 rounded font-medium ${appState.editorFilter === 'all' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">
                  Tất cả (${allQuestions.length})
                </button>
                <button type="button" onclick="setEditorFilter('manual_required')" class="py-1 rounded font-medium ${appState.editorFilter === 'manual_required' ? 'bg-white text-amber-800 shadow-sm' : 'text-slate-600'}">
                  Cần KT
                </button>
                <button type="button" onclick="setEditorFilter('unverified')" class="py-1 rounded font-medium ${appState.editorFilter === 'unverified' ? 'bg-white text-red-700 shadow-sm' : 'text-slate-600'}">
                  Chưa ĐA (${unverifiedCount})
                </button>
              </div>

              <!-- Question Items -->
              <div class="space-y-1.5 max-h-[520px] overflow-y-auto custom-scrollbar pr-1">
                ${filteredQuestions
                  .map((q) => {
                    const ak = db.answer_keys.find((k) => k.question_id === q.id);
                    const isSelected = activeQ && activeQ.id === q.id;
                    const isVerified = ak && ak.verification_status === 'verified';
                    const needsManual = q.review_status === 'manual_required' || q.review_status === 'needs_review';
                    return `
                      <button type="button" onclick="selectEditorQuestion('${q.id}')"
                        class="w-full p-2.5 rounded-lg border text-left transition-all flex items-start justify-between gap-2 ${
                          isSelected
                            ? 'border-blue-600 bg-blue-50/70 ring-1 ring-blue-600'
                            : 'border-slate-200 bg-white hover:bg-slate-50'
                        }">
                        <div class="min-w-0">
                          <div class="flex items-center gap-1.5">
                            <span class="text-xs font-bold text-slate-900">Câu ${q.order_index}</span>
                            <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 text-[10px] font-medium">${getQuestionTypeShortLabel(q.question_type)}</span>
                          </div>
                          <div class="text-[11px] text-slate-600 truncate mt-1">${escapeHtml(q.content)}</div>
                        </div>
                        <div class="flex flex-col items-end gap-1 shrink-0">
                          ${
                            q.question_type === 'essay'
                              ? `<span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 text-[10px]">Tự luận</span>`
                              : isVerified
                              ? `<span class="px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-semibold">Đã XN ĐA</span>`
                              : `<span class="px-1.5 py-0.5 rounded bg-amber-100 text-amber-900 text-[10px] font-semibold">Chưa ĐA</span>`
                          }
                          ${needsManual ? `<span class="text-[10px] text-amber-700 font-semibold">⚑ Cần kiểm tra</span>` : ''}
                        </div>
                      </button>
                    `;
                  })
                  .join('')}
              </div>
            </div>

            <!-- Middle Column: Active Question Form -->
            <div class="${appState.showSourcePreview ? 'xl:col-span-5' : 'lg:col-span-8'} bg-white rounded-xl border border-slate-200 p-5 space-y-4">
              ${
                !activeQ
                  ? `<div class="p-8 text-center text-xs text-slate-500">Chọn một câu hỏi bên trái hoặc bấm "+ Thêm câu" để biên tập.</div>`
                  : renderActiveQuestionEditorForm(qSet, activeQ, activeOpts, activeKey)
              }
            </div>

            <!-- Right Column: Source Document Split Viewer (Section 5.3) -->
            ${
              appState.showSourcePreview
                ? `
                <div class="xl:col-span-4 bg-white rounded-xl border border-slate-200 p-4 space-y-3">
                  <div class="flex items-center justify-between border-b border-slate-200 pb-2.5">
                    <div>
                      <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wider">Bản gốc tài liệu đối chiếu</h3>
                      <p class="text-[11px] text-slate-500">${sourceDoc ? escapeHtml(sourceDoc.filename) : 'Đề tạo thủ công (Không có file đính kèm)'}</p>
                    </div>
                    ${
                      activeQ
                        ? `<span class="px-2 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200 text-[11px] font-semibold">
                            ${escapeHtml(activeQ.source_region || `Trang ${activeQ.source_page || 1}`)}
                          </span>`
                        : ''
                    }
                  </div>

                  ${
                    sourceDoc && Array.isArray(sourceDoc.raw_pages) && sourceDoc.raw_pages.length > 0
                      ? sourceDoc.raw_pages
                          .map(
                            (p) => `
                          <div class="rounded-lg border ${
                            activeQ && activeQ.source_page === p.page ? 'border-blue-400 bg-blue-50/20' : 'border-slate-200 bg-slate-50'
                          } p-3">
                            <div class="text-[11px] font-bold text-slate-700 mb-1.5 flex items-center justify-between">
                              <span>Trang nguồn #${p.page}</span>
                              ${activeQ && activeQ.source_page === p.page ? `<span class="text-blue-600">● Đang đối chiếu Câu ${activeQ.order_index}</span>` : ''}
                            </div>
                            <pre class="text-[11px] text-slate-700 whitespace-pre-wrap font-mono leading-relaxed bg-white p-2.5 rounded border border-slate-200 max-h-60 overflow-y-auto custom-scrollbar">${escapeHtml(p.text)}</pre>
                          </div>
                        `
                          )
                          .join('')
                      : `<div class="p-6 text-center rounded-lg bg-slate-50 border border-slate-200 text-xs text-slate-500">
                          Đề thi này được khởi tạo thủ công. Bạn có thể đính kèm bảng số liệu hoặc sơ đồ minh họa trực tiếp trong khung biên tập câu hỏi.
                        </div>`
                  }
                </div>
              `
                : ''
            }
          </div>
        </div>
      `;
    }

    function getQuestionTypeShortLabel(qType) {
      const map = {
        mcq_single: '4 phương án',
        true_false_single: 'Đúng/Sai đơn',
        true_false_multi: 'Đúng/Sai 4 ý',
        short_answer: 'Trả lời ngắn',
        essay: 'Tự luận'
      };
      return map[qType] || qType;
    }

    function renderActiveQuestionEditorForm(qSet, q, opts, ak) {
      const isVerified = ak && ak.verification_status === 'verified';
      const needsReview = q.review_status === 'manual_required' || q.review_status === 'needs_review';

      let answerEditorHtml = '';
      if (q.question_type === 'mcq_single') {
        const curAns = (ak && ak.correct_answer && ak.correct_answer.value) || '';
        answerEditorHtml = `
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <label class="text-xs font-bold text-slate-800">Các phương án lựa chọn & Chọn đáp án đúng</label>
              <button type="button" onclick="addOptionToEditorQuestion('${q.id}')" class="text-xs text-blue-600 hover:underline font-medium">+ Thêm phương án</button>
            </div>
            ${opts
              .map(
                (o) => `
              <div class="flex items-center gap-2">
                <button type="button" onclick="setEditorMcqCorrectAnswer('${q.id}', '${o.label}')"
                  class="w-8 h-8 rounded-lg font-bold text-xs shrink-0 border transition-colors ${
                    curAns === o.label
                      ? 'bg-blue-600 text-white border-blue-600'
                      : 'bg-slate-50 text-slate-700 border-slate-300 hover:bg-blue-50'
                  }" title="Bấm để đặt ${o.label} làm đáp án đúng">
                  ${escapeHtml(o.label)}
                </button>
                <input type="text" value="${escapeHtml(o.content)}"
                  onchange="updateEditorOptionContent('${o.id}', this.value)"
                  class="flex-1 px-3 py-1.5 rounded-lg border border-slate-300 text-xs focus:outline-none focus:border-blue-600" />
              </div>
            `
              )
              .join('')}
          </div>
        `;
      } else if (q.question_type === 'true_false_single') {
        const curAns = (ak && ak.correct_answer && ak.correct_answer.value) || '';
        answerEditorHtml = `
          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-800">Chọn đáp án chính thức (Đúng / Sai đơn)</label>
            <div class="flex gap-3">
              <button type="button" onclick="setEditorTfSingleCorrectAnswer('${q.id}', 'TRUE')"
                class="flex-1 py-2 rounded-lg border text-xs font-semibold ${
                  curAns === 'TRUE' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-700 border-slate-300'
                }">Đúng (True)</button>
              <button type="button" onclick="setEditorTfSingleCorrectAnswer('${q.id}', 'FALSE')"
                class="flex-1 py-2 rounded-lg border text-xs font-semibold ${
                  curAns === 'FALSE' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-700 border-slate-300'
                }">Sai (False)</button>
            </div>
          </div>
        `;
      } else if (q.question_type === 'true_false_multi') {
        const stmtAns = (ak && ak.correct_answer && ak.correct_answer.statements) || {};
        answerEditorHtml = `
          <div class="space-y-2.5">
            <label class="text-xs font-bold text-slate-800">Các mệnh đề (a, b, c, d) & Đáp án riêng cho từng ý</label>
            ${opts
              .map((st) => {
                const val = stmtAns[st.label];
                return `
                  <div class="p-2.5 rounded-lg border border-slate-200 bg-slate-50/60 space-y-2">
                    <div class="flex items-center gap-2">
                      <span class="w-6 h-6 rounded bg-slate-200 text-slate-800 font-bold text-xs flex items-center justify-center shrink-0">${escapeHtml(st.label)})</span>
                      <input type="text" value="${escapeHtml(st.content)}"
                        onchange="updateEditorOptionContent('${st.id}', this.value)"
                        class="flex-1 px-2.5 py-1 rounded border border-slate-300 bg-white text-xs" />
                    </div>
                    <div class="flex items-center justify-end gap-2">
                      <span class="text-[11px] text-slate-500">Đáp án mệnh đề ${escapeHtml(st.label)}:</span>
                      <button type="button" onclick="setEditorTfMultiStatementAnswer('${q.id}', '${st.label}', true)"
                        class="px-2.5 py-1 rounded text-xs font-semibold border ${
                          val === true ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-700 border-slate-300'
                        }">Đúng</button>
                      <button type="button" onclick="setEditorTfMultiStatementAnswer('${q.id}', '${st.label}', false)"
                        class="px-2.5 py-1 rounded text-xs font-semibold border ${
                          val === false ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-700 border-slate-300'
                        }">Sai</button>
                    </div>
                  </div>
                `;
              })
              .join('')}
          </div>
        `;
      } else if (q.question_type === 'short_answer') {
        const cfg = (ak && ak.correct_answer) || { value: '', acceptedAnswers: [], numericTolerance: 0, trimWhitespace: true, caseSensitive: false };
        const acceptedStr = Array.isArray(cfg.acceptedAnswers) && cfg.acceptedAnswers.length > 0 ? cfg.acceptedAnswers.join('; ') : cfg.value || '';
        answerEditorHtml = `
          <div class="space-y-3 p-3.5 rounded-xl bg-slate-50 border border-slate-200">
            <div class="text-xs font-bold text-slate-800">Cấu hình đáp án Câu trả lời ngắn</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div class="sm:col-span-2">
                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Các đáp án tương đương được chấp nhận (Cách nhau bởi dấu chấm phẩy ;)</label>
                <input type="text" value="${escapeHtml(acceptedStr)}"
                  onchange="updateShortAnswerConfig('${q.id}', 'accepted', this.value)"
                  placeholder="Ví dụ: 141.4; 141,4"
                  class="w-full px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-xs" />
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Sai số số học cho phép (± Tolerance)</label>
                <input type="number" step="0.01" min="0" value="${Number(cfg.numericTolerance || 0)}"
                  onchange="updateShortAnswerConfig('${q.id}', 'tolerance', this.value)"
                  class="w-full px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-xs" />
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Đơn vị hiển thị cạnh ô nhập (Nếu có)</label>
                <input type="text" value="${escapeHtml(q.unit_label || '')}"
                  onchange="updateEditorQuestionField('${q.id}', 'unit_label', this.value)"
                  placeholder="Ví dụ: cm³, Ω, mol, %"
                  class="w-full px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-xs" />
              </div>
            </div>
            <div class="flex flex-wrap gap-4 pt-1">
              <label class="inline-flex items-center gap-1.5 text-[11px] text-slate-700">
                <input type="checkbox" ${cfg.trimWhitespace !== false ? 'checked' : ''}
                  onchange="updateShortAnswerConfig('${q.id}', 'trim', this.checked)" class="rounded border-slate-300 text-blue-600" />
                <span>Chuẩn hóa khoảng trắng thừa</span>
              </label>
              <label class="inline-flex items-center gap-1.5 text-[11px] text-slate-700">
                <input type="checkbox" ${cfg.caseSensitive ? 'checked' : ''}
                  onchange="updateShortAnswerConfig('${q.id}', 'case', this.checked)" class="rounded border-slate-300 text-blue-600" />
                <span>Phân biệt chữ HOA / chữ thường</span>
              </label>
            </div>
          </div>
        `;
      } else {
        answerEditorHtml = `
          <div class="p-3 rounded-lg bg-slate-50 border border-slate-200 text-xs text-slate-600">
            Câu hỏi <strong>Tự luận mở rộng</strong>: Hệ thống sẽ lưu bài làm của người học và đánh dấu trạng thái <strong>"Cần chấm thủ công"</strong> sau khi nộp bài.
          </div>
        `;
      }

      return `
        <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-200">
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-1 rounded-lg bg-blue-600 text-white text-xs font-bold">Câu ${q.order_index}</span>
            <select onchange="changeEditorQuestionType('${q.id}', this.value)"
              class="px-2.5 py-1 rounded-lg border border-slate-300 text-xs font-medium bg-white">
              <option value="mcq_single" ${q.question_type === 'mcq_single' ? 'selected' : ''}>Trắc nghiệm 4 phương án (A, B, C, D)</option>
              <option value="true_false_single" ${q.question_type === 'true_false_single' ? 'selected' : ''}>Đúng / Sai (1 nhận định đơn)</option>
              <option value="true_false_multi" ${q.question_type === 'true_false_multi' ? 'selected' : ''}>Đúng / Sai (Nhiều nhận định a, b, c, d)</option>
              <option value="short_answer" ${q.question_type === 'short_answer' ? 'selected' : ''}>Câu trả lời ngắn (Số / Văn bản ngắn)</option>
              <option value="essay" ${q.question_type === 'essay' ? 'selected' : ''}>Tự luận mở rộng (Chấm thủ công)</option>
            </select>
          </div>

          <div class="flex items-center gap-1.5">
            <button type="button" onclick="moveEditorQuestion('${q.id}', -1)" title="Chuyển lên" class="p-1.5 rounded border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs">↑</button>
            <button type="button" onclick="moveEditorQuestion('${q.id}', 1)" title="Chuyển xuống" class="p-1.5 rounded border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs">↓</button>
            <button type="button" onclick="toggleEditorQuestionReviewFlag('${q.id}')"
              class="px-2.5 py-1 rounded border text-xs font-medium ${
                needsReview ? 'bg-amber-100 text-amber-900 border-amber-300' : 'bg-white text-slate-600 border-slate-200'
              }">
              ${needsReview ? '⚑ Đang đánh dấu cần KT' : '⚑ Đánh dấu kiểm tra'}
            </button>
            <button type="button" onclick="deleteEditorQuestion('${q.id}')" class="px-2.5 py-1 rounded border border-red-200 text-red-600 hover:bg-red-50 text-xs font-medium">
              Xóa câu
            </button>
          </div>
        </div>

        <!-- Question Part & Points -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="sm:col-span-2">
            <label class="block text-[11px] font-semibold text-slate-600 mb-1">Phần thi / Nhóm câu hỏi</label>
            <input type="text" value="${escapeHtml(q.part_name || 'Phần I')}"
              onchange="updateEditorQuestionField('${q.id}', 'part_name', this.value)"
              class="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs" />
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-600 mb-1">Điểm tối đa</label>
            <input type="number" step="0.25" min="0.25" value="${Number(q.points || 1)}"
              onchange="updateEditorQuestionField('${q.id}', 'points', Number(this.value))"
              class="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs" />
          </div>
        </div>

        <!-- Question Content -->
        <div>
          <label class="block text-xs font-bold text-slate-800 mb-1">Nội dung câu hỏi (Hỗ trợ ký hiệu toán học trong cặp dấu $...$)</label>
          <textarea rows="3" onchange="updateEditorQuestionField('${q.id}', 'content', this.value)"
            class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs leading-relaxed focus:outline-none focus:border-blue-600">${escapeHtml(q.content)}</textarea>
        </div>

        <!-- Media Attachment Toggle (Table / Diagram) -->
        <div class="flex flex-wrap items-center justify-between gap-2 p-2.5 rounded-lg bg-slate-50 border border-slate-200">
          <div class="text-xs text-slate-700">
            <strong>Hình minh họa / Bảng dữ liệu:</strong>
            ${q.media_attachment ? `<span class="text-blue-700 font-semibold">${escapeHtml(q.media_attachment.title)}</span>` : '<span class="text-slate-400">Không đính kèm</span>'}
          </div>
          <div class="flex gap-1.5">
            <button type="button" onclick="attachSampleMediaToQuestion('${q.id}', 'table')" class="px-2 py-1 rounded border border-slate-300 bg-white text-[11px] hover:bg-slate-100">+ Bảng số liệu</button>
            <button type="button" onclick="attachSampleMediaToQuestion('${q.id}', 'svg_diagram')" class="px-2 py-1 rounded border border-slate-300 bg-white text-[11px] hover:bg-slate-100">+ Sơ đồ hình học/mạch</button>
            ${q.media_attachment ? `<button type="button" onclick="attachSampleMediaToQuestion('${q.id}', null)" class="px-2 py-1 rounded border border-red-200 bg-white text-red-600 text-[11px]">Gỡ hình/bảng</button>` : ''}
          </div>
        </div>

        <!-- Options / Answer Key Configuration -->
        ${answerEditorHtml}

        <!-- Answer Verification Gate (Requirement 5.3) -->
        ${
          q.question_type !== 'essay'
            ? `
            <div class="p-3.5 rounded-xl border ${
              isVerified ? 'border-emerald-200 bg-emerald-50/60' : 'border-amber-300 bg-amber-50'
            } flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <div class="text-xs font-bold ${isVerified ? 'text-emerald-900' : 'text-amber-900'}">
                  ${
                    isVerified
                      ? '✓ Đáp án câu này đã được xác minh — Đã bật chấm tự động'
                      : '⚠ Câu hỏi chưa có đáp án xác minh đáng tin cậy'
                  }
                </div>
                <div class="text-[11px] ${isVerified ? 'text-emerald-700' : 'text-amber-800'} mt-0.5">
                  ${
                    isVerified
                      ? 'Khi người học nộp bài, máy chủ sẽ tự động chấm điểm câu này theo đáp án đã xác minh.'
                      : 'Theo quy tắc an toàn: hệ thống KHÔNG tự động gán điểm đúng/sai cho câu chưa xác minh đáp án.'
                  }
                </div>
              </div>
              <button type="button" onclick="toggleAnswerKeyVerification('${q.id}')"
                class="px-3.5 py-2 rounded-lg text-xs font-semibold shrink-0 ${
                  isVerified
                    ? 'border border-amber-300 bg-white text-amber-800 hover:bg-amber-100'
                    : 'bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm'
                }">
                ${isVerified ? 'Đặt lại: Chưa xác minh' : '✓ Xác nhận đáp án & Bật chấm tự động'}
              </button>
            </div>
          `
            : ''
        }

        <!-- Explanation Editor -->
        <div>
          <label class="block text-xs font-bold text-slate-800 mb-1">Lời giải chi tiết & Hướng dẫn chấm</label>
          <textarea rows="2" onchange="updateEditorExplanation('${q.id}', this.value)"
            placeholder="Nhập lời giải chi tiết sẽ hiển thị sau khi người học nộp bài..."
            class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs">${escapeHtml((ak && ak.explanation) || '')}</textarea>
        </div>
      `;
    }

    function setEditorFilter(filterVal) {
      appState.editorFilter = filterVal;
      renderApp();
    }

    function selectEditorQuestion(qId) {
      appState.selectedEditorQuestionId = qId;
      renderApp();
    }

    function toggleEditorSourcePreview() {
      appState.showSourcePreview = !appState.showSourcePreview;
      renderApp();
    }

    function updateExamMetadataField(setId, field, val) {
      const s = db.question_sets.find((x) => x.id === setId);
      if (!s || s.owner_id !== db.currentUserId) return;
      s[field] = val;
      s.updated_at = new Date().toISOString();
      persistDb();
      showToast('Đã cập nhật thông tin đề thi.', 'info');
      renderApp();
    }

    function updateEditorQuestionField(qId, field, val) {
      const q = db.questions.find((x) => x.id === qId);
      if (!q) return;
      q[field] = val;
      persistDb();
      renderApp();
    }

    function updateEditorOptionContent(optId, val) {
      const opt = db.question_options.find((o) => o.id === optId);
      if (!opt) return;
      opt.content = val;
      persistDb();
    }

    function addOptionToEditorQuestion(qId) {
      const existing = db.question_options.filter((o) => o.question_id === qId);
      const nextChar = String.fromCharCode(65 + existing.length);
      db.question_options.push({
        id: generateId('opt'),
        question_id: qId,
        label: nextChar,
        content: `Phương án ${nextChar}`,
        order_index: existing.length + 1
      });
      persistDb();
      renderApp();
    }

    function setEditorMcqCorrectAnswer(qId, label) {
      let ak = db.answer_keys.find((k) => k.question_id === qId);
      if (!ak) {
        ak = { id: generateId('ak'), question_id: qId, correct_answer: { value: label }, explanation: '', verification_status: 'verified' };
        db.answer_keys.push(ak);
      } else {
        ak.correct_answer = { value: label };
        ak.verification_status = 'verified';
      }
      persistDb();
      showToast(`Đã chọn đáp án đúng là ${label} và xác minh.`, 'success');
      renderApp();
    }

    function setEditorTfSingleCorrectAnswer(qId, val) {
      let ak = db.answer_keys.find((k) => k.question_id === qId);
      if (!ak) {
        ak = { id: generateId('ak'), question_id: qId, correct_answer: { value: val }, explanation: '', verification_status: 'verified' };
        db.answer_keys.push(ak);
      } else {
        ak.correct_answer = { value: val };
        ak.verification_status = 'verified';
      }
      persistDb();
      renderApp();
    }

    function setEditorTfMultiStatementAnswer(qId, stmtKey, boolVal) {
      let ak = db.answer_keys.find((k) => k.question_id === qId);
      if (!ak) {
        ak = { id: generateId('ak'), question_id: qId, correct_answer: { statements: { a: true, b: false, c: true, d: true } }, explanation: '', verification_status: 'verified' };
        db.answer_keys.push(ak);
      }
      if (!ak.correct_answer || !ak.correct_answer.statements) {
        ak.correct_answer = { statements: {} };
      }
      ak.correct_answer.statements[stmtKey] = boolVal;
      ak.verification_status = 'verified';
      persistDb();
      renderApp();
    }

    function updateShortAnswerConfig(qId, field, value) {
      let ak = db.answer_keys.find((k) => k.question_id === qId);
      if (!ak) {
        ak = {
          id: generateId('ak'),
          question_id: qId,
          correct_answer: { value: '', acceptedAnswers: [], numericTolerance: 0, trimWhitespace: true, caseSensitive: false },
          explanation: '',
          verification_status: 'unverified'
        };
        db.answer_keys.push(ak);
      }
      if (!ak.correct_answer || typeof ak.correct_answer !== 'object') {
        ak.correct_answer = { value: '', acceptedAnswers: [], numericTolerance: 0, trimWhitespace: true, caseSensitive: false };
      }
      if (field === 'accepted') {
        const arr = String(value)
          .split(';')
          .map((s) => s.trim())
          .filter(Boolean);
        ak.correct_answer.acceptedAnswers = arr;
        ak.correct_answer.value = arr[0] || '';
        if (arr.length > 0) ak.verification_status = 'verified';
      } else if (field === 'tolerance') {
        ak.correct_answer.numericTolerance = Math.max(0, Number(value) || 0);
      } else if (field === 'trim') {
        ak.correct_answer.trimWhitespace = Boolean(value);
      } else if (field === 'case') {
        ak.correct_answer.caseSensitive = Boolean(value);
      }
      persistDb();
      renderApp();
    }

    function toggleAnswerKeyVerification(qId) {
      let ak = db.answer_keys.find((k) => k.question_id === qId);
      const q = db.questions.find((x) => x.id === qId);
      if (!q || !ak) return;

      if (ak.verification_status === 'verified') {
        ak.verification_status = 'unverified';
        showToast('Đã chuyển câu hỏi sang trạng thái "Chưa xác minh đáp án".', 'warning');
      } else {
        if (!ak.correct_answer || (typeof ak.correct_answer === 'object' && Object.keys(ak.correct_answer).length === 0)) {
          if (q.question_type === 'mcq_single') ak.correct_answer = { value: 'A' };
          else if (q.question_type === 'true_false_single') ak.correct_answer = { value: 'TRUE' };
          else if (q.question_type === 'true_false_multi') ak.correct_answer = { statements: { a: true, b: false, c: true, d: true } };
          else if (q.question_type === 'short_answer') ak.correct_answer = { value: '12', acceptedAnswers: ['12'], trimWhitespace: true, caseSensitive: false, numericTolerance: 0 };
        }
        ak.verification_status = 'verified';
        q.review_status = 'verified';
        showToast('Đã xác minh đáp án và bật chấm tự động cho câu hỏi!', 'success');
      }
      persistDb();
      renderApp();
    }

    function updateEditorExplanation(qId, val) {
      let ak = db.answer_keys.find((k) => k.question_id === qId);
      if (!ak) {
        ak = { id: generateId('ak'), question_id: qId, correct_answer: null, explanation: val, verification_status: 'unverified' };
        db.answer_keys.push(ak);
      } else {
        ak.explanation = val;
      }
      persistDb();
    }

    function changeEditorQuestionType(qId, newType) {
      const q = db.questions.find((x) => x.id === qId);
      if (!q) return;
      q.question_type = newType;
      db.question_options = db.question_options.filter((o) => o.question_id !== qId);

      if (newType === 'mcq_single') {
        ['A', 'B', 'C', 'D'].forEach((lbl, idx) => {
          db.question_options.push({
            id: generateId('opt'),
            question_id: qId,
            label: lbl,
            content: `Phương án ${lbl}`,
            order_index: idx + 1
          });
        });
      } else if (newType === 'true_false_multi') {
        ['a', 'b', 'c', 'd'].forEach((key, idx) => {
          db.question_options.push({
            id: generateId('stmt'),
            question_id: qId,
            label: key,
            content: `Nhận định ${key}) của câu hỏi`,
            order_index: idx + 1
          });
        });
      }

      let ak = db.answer_keys.find((k) => k.question_id === qId);
      if (ak) {
        if (newType === 'mcq_single') ak.correct_answer = { value: 'A' };
        else if (newType === 'true_false_single') ak.correct_answer = { value: 'TRUE' };
        else if (newType === 'true_false_multi') ak.correct_answer = { statements: { a: true, b: false, c: true, d: false } };
        else if (newType === 'short_answer') ak.correct_answer = { value: '10', acceptedAnswers: ['10'], trimWhitespace: true, caseSensitive: false, numericTolerance: 0 };
        else ak.correct_answer = null;
      }
      persistDb();
      renderApp();
    }

    function attachSampleMediaToQuestion(qId, mediaType) {
      const q = db.questions.find((x) => x.id === qId);
      if (!q) return;
      if (!mediaType) {
        q.media_attachment = null;
      } else if (mediaType === 'table') {
        q.media_attachment = {
          type: 'table',
          title: 'Bảng số liệu thực nghiệm / Bảng biến thiên',
          headers: ['Đại lượng x', 'Giá trị 1', 'Giá trị 2', 'Giá trị 3'],
          rows: [
            ['Kết quả đo y', '12.5', '24.0', '36.5']
          ]
        };
      } else {
        q.media_attachment = {
          type: 'svg_diagram',
          title: 'Sơ đồ minh họa trực quan',
          svg_kind: 'rlc_circuit'
        };
      }
      persistDb();
      renderApp();
    }

    function moveEditorQuestion(qId, direction) {
      const q = db.questions.find((x) => x.id === qId);
      if (!q) return;
      const siblings = db.questions
        .filter((x) => x.question_set_id === q.question_set_id)
        .sort((a, b) => a.order_index - b.order_index);
      const idx = siblings.findIndex((x) => x.id === qId);
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= siblings.length) return;
      const other = siblings[targetIdx];
      const tmp = q.order_index;
      q.order_index = other.order_index;
      other.order_index = tmp;
      persistDb();
      renderApp();
    }

    function toggleEditorQuestionReviewFlag(qId) {
      const q = db.questions.find((x) => x.id === qId);
      if (!q) return;
      q.review_status = q.review_status === 'verified' ? 'needs_review' : 'verified';
      persistDb();
      renderApp();
    }

    function deleteEditorQuestion(qId) {
      const q = db.questions.find((x) => x.id === qId);
      if (!q) return;
      const siblings = db.questions.filter((x) => x.question_set_id === q.question_set_id);
      if (siblings.length <= 1) {
        showToast('Đề thi phải có ít nhất 1 câu hỏi!', 'warning');
        return;
      }
      openAppModal({
        title: `Xóa Câu ${q.order_index} khỏi đề thi`,
        message: 'Bạn có chắc chắn muốn xóa câu hỏi này? Thứ tự các câu còn lại sẽ được đánh số lại tự động.',
        confirmText: 'Xóa câu hỏi',
        danger: true,
        onConfirm: () => {
          const setId = q.question_set_id;
          db.questions = db.questions.filter((x) => x.id !== qId);
          db.question_options = db.question_options.filter((o) => o.question_id !== qId);
          db.answer_keys = db.answer_keys.filter((k) => k.question_id !== qId);
          db.questions
            .filter((x) => x.question_set_id === setId)
            .sort((a, b) => a.order_index - b.order_index)
            .forEach((item, i) => {
              item.order_index = i + 1;
            });
          const rem = db.questions.find((x) => x.question_set_id === setId);
          appState.selectedEditorQuestionId = rem ? rem.id : null;
          persistDb();
          showToast('Đã xóa câu hỏi.', 'info');
          renderApp();
        }
      });
    }

    function addNewQuestionToSet(setId) {
      const existing = db.questions.filter((q) => q.question_set_id === setId);
      const qId = generateId('q');
      const nextOrder = existing.length + 1;
      db.questions.push({
        id: qId,
        question_set_id: setId,
        order_index: nextOrder,
        part_name: 'Phần I. Trắc nghiệm 4 phương án',
        question_type: 'mcq_single',
        content: `Nội dung câu hỏi mới số ${nextOrder}...`,
        media_attachment: null,
        unit_label: null,
        source_document_id: null,
        source_page: 1,
        source_region: 'Thêm thủ công',
        points: 1.0,
        review_status: 'verified'
      });
      ['A', 'B', 'C', 'D'].forEach((lbl, idx) => {
        db.question_options.push({
          id: generateId('opt'),
          question_id: qId,
          label: lbl,
          content: `Phương án ${lbl}`,
          order_index: idx + 1
        });
      });
      db.answer_keys.push({
        id: generateId('ak'),
        question_id: qId,
        correct_answer: { value: 'A' },
        explanation: '',
        verification_status: 'verified'
      });
      appState.selectedEditorQuestionId = qId;
      persistDb();
      showToast(`Đã thêm Câu ${nextOrder}.`, 'success');
      renderApp();
    }

    function saveExamAsDraft(setId) {
      const s = db.question_sets.find((x) => x.id === setId);
      if (!s) return;
      s.publication_status = 'draft';
      s.updated_at = new Date().toISOString();
      persistDb();
      showToast('Đã lưu đề ở trạng thái Bản nháp.', 'success');
      renderApp();
    }

    function publishExamSet(setId, openRoomImmediately) {
      const s = db.question_sets.find((x) => x.id === setId);
      if (!s) return;
      s.publication_status = 'published';
      s.updated_at = new Date().toISOString();
      persistDb();
      showToast(`Đã xuất bản đề "${s.title}" thành công!`, 'success');
      if (openRoomImmediately) {
        startNewExamAttempt(setId);
      } else {
        renderApp();
      }
    }

    // =========================================================================
    // 15. PAGE 6: CHI TIẾT ĐỀ (EXAM DETAIL - Section 3.6)
    // =========================================================================
    function renderExamDetailPage() {
      const setId = appState.detailSetId || (db.question_sets[0] && db.question_sets[0].id);
      const qSet = db.question_sets.find((s) => s.id === setId);
      if (!qSet) {
        return `<div class="p-8 text-center text-xs text-slate-500">Không tìm thấy thông tin đề thi.</div>`;
      }

      const qs = db.questions.filter((q) => q.question_set_id === qSet.id).sort((a, b) => a.order_index - b.order_index);
      const attempts = db.exam_attempts.filter((a) => a.question_set_id === qSet.id && a.user_id === db.currentUserId);
      const totalPoints = qs.reduce((acc, q) => acc + (Number(q.points) || 0), 0);

      return `
        <div class="p-4 sm:p-6 lg:p-8 max-w-5xl mx-auto w-full space-y-6">
          <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-200">
              <div>
                <div class="flex items-center gap-2">
                  <span class="px-2 py-0.5 rounded bg-blue-50 text-blue-700 text-xs font-semibold">${escapeHtml(qSet.subject)}</span>
                  <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 text-xs">${escapeHtml(qSet.grade_level)}</span>
                  <span class="px-2 py-0.5 rounded text-xs font-semibold ${
                    qSet.publication_status === 'published' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-800'
                  }">${qSet.publication_status === 'published' ? 'Đã xuất bản' : 'Bản nháp'}</span>
                </div>
                <h2 class="text-lg font-bold text-slate-900 mt-1.5">${escapeHtml(qSet.title)}</h2>
                <p class="text-xs text-slate-600 mt-1">${escapeHtml(qSet.description || 'Không có mô tả.')}</p>
              </div>
              <div class="flex flex-wrap gap-2 shrink-0">
                <button type="button" onclick="startNewExamAttempt('${qSet.id}')" class="px-4 py-2.5 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700 shadow-sm">
                  Mở phòng làm bài →
                </button>
                <button type="button" onclick="navigateTo('editor', { editingSetId: '${qSet.id}' })" class="px-3.5 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-700 text-xs font-medium hover:bg-slate-50">
                  Biên tập câu hỏi
                </button>
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">
              <div class="p-3 rounded-lg bg-slate-50 border border-slate-200">
                <div class="text-[11px] text-slate-500">Số lượng câu hỏi</div>
                <div class="text-base font-bold text-slate-900 mt-0.5">${qs.length} câu</div>
              </div>
              <div class="p-3 rounded-lg bg-slate-50 border border-slate-200">
                <div class="text-[11px] text-slate-500">Tổng điểm tối đa</div>
                <div class="text-base font-bold text-slate-900 mt-0.5">${totalPoints.toFixed(2)} điểm</div>
              </div>
              <div class="p-3 rounded-lg bg-slate-50 border border-slate-200">
                <div class="text-[11px] text-slate-500">Thời gian làm bài</div>
                <div class="text-base font-bold text-slate-900 mt-0.5">${qSet.duration_seconds > 0 ? Math.round(qSet.duration_seconds / 60) + ' phút' : 'Không giới hạn'}</div>
              </div>
              <div class="p-3 rounded-lg bg-slate-50 border border-slate-200">
                <div class="text-[11px] text-slate-500">Số lượt bạn đã làm</div>
                <div class="text-base font-bold text-blue-600 mt-0.5">${attempts.length} lượt</div>
              </div>
            </div>

            <div class="mt-6">
              <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2.5">Cấu trúc câu hỏi trong đề</h3>
              <div class="divide-y divide-slate-200 border border-slate-200 rounded-xl overflow-hidden">
                ${qs
                  .map((q) => {
                    const ak = db.answer_keys.find((k) => k.question_id === q.id);
                    const isVer = ak && ak.verification_status === 'verified';
                    return `
                      <div class="p-3 bg-white flex items-center justify-between gap-3 text-xs">
                        <div class="min-w-0">
                          <span class="font-bold text-slate-900">Câu ${q.order_index}:</span>
                          <span class="text-slate-600 ml-1">${escapeHtml(q.content.slice(0, 110))}${q.content.length > 110 ? '...' : ''}</span>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                          <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 text-[11px]">${getQuestionTypeShortLabel(q.question_type)}</span>
                          <span class="px-2 py-0.5 rounded text-[11px] font-medium ${isVer ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-800'}">
                            ${q.question_type === 'essay' ? 'Chấm thủ công' : isVer ? 'Đã XN đáp án' : 'Chưa XN đáp án'}
